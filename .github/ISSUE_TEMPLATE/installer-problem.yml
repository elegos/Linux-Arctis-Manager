name: Installer problem / OS not supported
description: scripts/install.sh (the curl | sh user-level installer) failed, or your OS needs its own build.
title: "[installer] "
labels: ["installer", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The installer picks the **generic** build unless one specific to your OS exists.
        Most failures are a missing system library or a too-old glibc, and the installer prints exactly which.

        **Quickest way to give us everything:** run
        `curl --proto '=https' --tlsv1.2 -fsSL https://github.com/elegos/Linux-Arctis-Manager/releases/latest/download/install.sh | sh -s -- --diagnose`
        and paste its output below.
  - type: textarea
    id: diagnose
    attributes:
      label: Output of `install.sh --diagnose`
      description: The block between the triple backticks (OS, glibc, release, problems found).
      render: text
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it stop?
      options:
        - Prerequisite check (missing library / glibc too old / missing command)
        - Signature or checksum verification
        - Downloading uv / Python / dependencies
        - Privileged step (setcap)
        - Starting the services
        - Everything installed, but the app does not work
        - Uninstall or upgrade
        - Other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full installer output
      description: Copy the whole terminal output, from the first line to the error.
      render: text
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Which build did it use?
      options:
        - Generic (default)
        - An OS-specific one
        - I don't know
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Another copy (distro package, old v2 install) is not already installed, or the installer told me how to remove it.
          required: true
        - label: I ran the installer as my normal user (not root).
          required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Immutable/atomic OS? Container? Unusual home directory or mount options (`nosuid`)?
