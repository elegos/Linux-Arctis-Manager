name: Build release tarball (reusable)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # The prebuilt tarball scripts/install.sh installs into ~/.local. Built on
  # the *oldest* glibc we're willing to support (Ubuntu 22.04: 2.35) - the
  # same idea as a manylinux wheel: build old, run anywhere newer. The real
  # floor is measured from the binaries and written to manifest.txt, which is
  # what the installer actually checks against the host.
  #
  # Two variants, because the daemon links the system OpenSSL dynamically and
  # libssl.so.3 / libssl.so.4 are not interchangeable: "generic" (OpenSSL 3,
  # built on Ubuntu 22.04) and "generic-ossl4" (OpenSSL 4, built on Fedora 45,
  # whose glibc floor is therefore higher). scripts/install.sh picks the one
  # matching the host's libssl.
  build-tarball:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: generic
            image: ubuntu:22.04
            family: deb
          - target: generic-ossl4
            image: fedora:45
            family: rpm
    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - name: Install build dependencies
        run: |
          set -e
          if [ "${{ matrix.family }}" = rpm ]; then
            dnf install -y ca-certificates curl git make binutils gcc pkgconf-pkg-config \
              systemd-devel openssl-devel pulseaudio-libs-devel glib2-devel \
              python3 python3-pip tar gzip findutils
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates curl git make binutils build-essential pkg-config \
              libudev-dev libssl-dev libpulse-dev libglib2.0-bin \
              python3 python3-pip
          fi
          # Same reason as packaging/debian/rules: the distro's rustc is
          # behind this project's MSRV.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          pip3 install --no-cache-dir uv==0.10.9
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v5

      - name: Build tarball
        run: ./scripts/build-release-tarball.sh --target ${{ matrix.target }} --out /out

      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: /out/*.tar.gz
