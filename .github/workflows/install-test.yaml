name: Distro install test (Linux)

on:
  push:
  pull_request:

jobs:
  build-pkg:
    uses: ./.github/workflows/build-pkg.yaml

  # Installs the artifact from build-pkg on a *fresh* instance of the same
  # image via the distro's own package manager — this is the step that
  # actually resolves depends=/Requires:/Depends: against that distro's
  # repos, catching a missing or wrong runtime dependency declaration.
  install-test:
    needs: build-pkg
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-pkg.outputs.matrix) }}

    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: pkg-${{ matrix.slug }}
          path: /pkg

      - name: Install package
        run: |
          set -e
          case "${{ matrix.family }}" in
            arch)
              # pacman sandboxes install-scriptlet execution in an isolated
              # network namespace; Docker's default container capabilities
              # can't create one ("could not isolate the network: Operation
              # not permitted"), so it refuses to run lam.install's
              # post_install (the setcap step) at all instead of proceeding
              # unsandboxed. A real machine has normal namespace support and
              # never hits this — CI-only workaround, not something to
              # weaken in the package itself.
              if ! grep -q '^DisableSandboxNetwork' /etc/pacman.conf; then
                sed -i '/^\[options\]/a DisableSandboxNetwork' /etc/pacman.conf
              fi
              pacman -Sy --noconfirm
              pacman -U --noconfirm /pkg/*.pkg.tar.zst
              ;;
            rpm)
              dnf install -y /pkg/*.rpm
              ;;
            deb)
              apt-get update

              # linux-arctis-manager-gnome-extension needs gnome-shell >=45;
              # older distro repos (e.g. Debian oldstable) simply don't
              # carry that version, so apt can never satisfy the Depends —
              # a real, correct dependency-resolution failure, not a
              # packaging bug. Skip installing that one package in that
              # case rather than failing the whole distro's install test.
              pkgs=(/pkg/*.deb)
              ext_pkg=$(ls /pkg/*gnome-extension*.deb 2>/dev/null || true)
              if [ -n "$ext_pkg" ]; then
                gs_ver="$(apt-cache policy gnome-shell | awk '/Candidate:/{print $2}')"
                if [ -z "$gs_ver" ] || [ "$gs_ver" = "(none)" ] || ! dpkg --compare-versions "$gs_ver" ge 45; then
                  echo "Skipping $ext_pkg: repo's gnome-shell ($gs_ver) is older than the >=45 it depends on"
                  pkgs=()
                  for p in /pkg/*.deb; do
                    [ "$p" = "$ext_pkg" ] || pkgs+=("$p")
                  done
                fi
              fi
              DEBIAN_FRONTEND=noninteractive apt-get install -y "${pkgs[@]}"
              ;;
          esac

      - name: Install test
        run: |
          chmod +x tests/install-test.sh
          PREFIX=/usr ./tests/install-test.sh
