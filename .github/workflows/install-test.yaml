name: Distro install test (Linux)

on:
  push:
  pull_request:

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - id: resolve
        run: python3 .github/scripts/resolve_distro_matrix.py >> "$GITHUB_OUTPUT"

  # Builds the real package (PKGBUILD / .spec / debian/control) on each
  # target distro/version. Build-time deps come straight from the packaging
  # recipe itself (makepkg reads depends=/makedepends=; the rpm/deb steps
  # below parse BuildRequires:/Build-Depends: from the recipe files), not a
  # hand-picked list in this workflow — so a wrong/missing declaration here
  # fails the build, same as it would for a real packager.
  build-pkg:
    needs: resolve-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - uses: actions/checkout@v5

      - name: Build package
        run: |
          set -e
          VERSION_RAW=$(cat VERSION)

          case "${{ matrix.family }}" in
            arch)
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git sudo
              # CachyOS's own makepkg.conf defaults CFLAGS to -march=native,
              # correct for a real user (same machine builds and runs it),
              # wrong here: build-pkg and install-test land on different
              # runner VMs, so a package built with the *builder's* exact
              # CPU features can hit SIGILL on the *installer's* CPU. Force
              # a portable baseline for this CI verification build only —
              # not something to change in the PKGBUILD itself, which
              # correctly defers to the ambient system's own makepkg.conf.
              sed -i 's/-march=native/-march=x86-64/' /etc/makepkg.conf
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

              mkdir -p /home/builder/source /home/builder/pkgbuild
              cp -r . /home/builder/source
              cp packaging/containers/arch.local.PKGBUILD /home/builder/pkgbuild/PKGBUILD
              cp packaging/arch/lam.install /home/builder/pkgbuild/lam.install
              # Arch pkgver can't contain '-'
              sed -i "s/^pkgver=.*/pkgver=$(echo "$VERSION_RAW" | sed 's/-//g')/" /home/builder/pkgbuild/PKGBUILD
              chown -R builder:builder /home/builder

              cd /home/builder/pkgbuild
              su builder -c 'makepkg -s --noconfirm --skippgpcheck'
              mkdir -p /out
              cp ./*.pkg.tar.zst /out/
              ;;

            rpm)
              dnf install -y rpm-build rpmdevtools tar gzip
              rpmdev-setuptree
              PKGNAME=linux-arctis-manager
              VERSION=$(echo "$VERSION_RAW" | sed 's/-/~/g')
              tar czf "$HOME/rpmbuild/SOURCES/${PKGNAME}-${VERSION}.tar.gz" \
                  --transform "s,^\./,${PKGNAME}-${VERSION}/," \
                  --exclude='./.git' --exclude='./.venv' --exclude='./dist' --exclude='./daemon/target' \
                  .
              sed "s/^Version:.*/Version:        ${VERSION}/" \
                  packaging/fedora/linux-arctis-manager.spec \
                  > "$HOME/rpmbuild/SPECS/${PKGNAME}.spec"

              # Build deps come straight from the spec's own BuildRequires:,
              # not a list maintained separately in this workflow.
              BUILD_DEPS=$(grep -E '^BuildRequires:' "$HOME/rpmbuild/SPECS/${PKGNAME}.spec" | awk '{print $2}')
              dnf install -y $BUILD_DEPS

              rpmbuild -ba "$HOME/rpmbuild/SPECS/${PKGNAME}.spec"
              mkdir -p /out
              find "$HOME/rpmbuild/RPMS" -name "${PKGNAME}-[0-9]*.rpm" \
                  ! -name '*debuginfo*' ! -name '*debugsource*' -exec cp {} /out/ \;
              ;;

            deb)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                devscripts debhelper equivs dpkg-dev
              PKGNAME=linux-arctis-manager
              VERSION=$(echo "$VERSION_RAW" | sed 's/-/~/g')
              mkdir -p /tmp/build
              cp -r . "/tmp/build/${PKGNAME}-${VERSION}"
              cd "/tmp/build/${PKGNAME}-${VERSION}"
              ln -s packaging/debian debian

              # Build deps come straight from debian/control's own
              # Build-Depends:, not a list maintained separately here.
              # Building + installing as two explicit steps (rather than
              # mk-build-deps --install's own orchestration) sidesteps an
              # apt quirk where its "correcting dependencies" pass drops the
              # just-unpacked meta-package after pulling in the real deps,
              # reporting a false failure even though everything installed.
              mk-build-deps --tool 'apt-get -y --no-install-recommends' debian/control
              apt-get -y --no-install-recommends install ./linux-arctis-manager-build-deps_*.deb

              dpkg-buildpackage -us -uc -b
              mkdir -p /out
              cp /tmp/build/*.deb /out/
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.slug }}
          path: /out/*

  # Installs the artifact from build-pkg on a *fresh* instance of the same
  # image via the distro's own package manager — this is the step that
  # actually resolves depends=/Requires:/Depends: against that distro's
  # repos, catching a missing or wrong runtime dependency declaration.
  install-test:
    needs: [resolve-matrix, build-pkg]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: pkg-${{ matrix.slug }}
          path: /pkg

      - name: Install package
        run: |
          set -e
          case "${{ matrix.family }}" in
            arch)
              # CachyOS's pacman sandboxes install-scriptlet execution in an
              # isolated network namespace; Docker's default container
              # capabilities can't create one ("could not isolate the
              # network: Operation not permitted"), so it refuses to run
              # lam.install's post_install (the setcap step) at all instead
              # of proceeding unsandboxed. A real CachyOS machine has normal
              # namespace support and never hits this — CI-only workaround,
              # not something to weaken in the package itself.
              if ! grep -q '^DisableSandboxNetwork' /etc/pacman.conf; then
                sed -i '/^\[options\]/a DisableSandboxNetwork' /etc/pacman.conf
              fi
              pacman -Sy --noconfirm
              pacman -U --noconfirm /pkg/*.pkg.tar.zst
              ;;
            rpm)
              dnf install -y /pkg/*.rpm
              ;;
            deb)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y /pkg/*.deb
              ;;
          esac

      # Temporary: CachyOS's install-test has SIGILL'd on lam-daemon startup
      # on the GH-hosted runner three times in a row, but the identical
      # build+install flow (real makepkg + pacman -U, same package) runs
      # clean locally on a CPU with full x86-64-v3 support — so this isn't
      # reproducible off-runner. Capture the runner's actual CPU flags and a
      # real gdb backtrace here so the next failure has a root cause instead
      # of another guess. Remove once the cause is confirmed and fixed.
      - name: Diagnose CachyOS SIGILL (temporary)
        if: matrix.slug == 'cachyos'
        run: |
          set -x
          grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512f|bmi1|bmi2|fma|f16c|lzcnt|movbe|abm|sse4_2)$' || true
          pacman -Sy --noconfirm --needed gdb
          ulimit -c unlimited
          gdb -batch -ex run -ex bt -ex "info registers" -ex "x/8i \$pc" --args /usr/bin/lam-daemon --log-level=error || true
        continue-on-error: true

      - name: Install test
        run: |
          chmod +x tests/install-test.sh
          PREFIX=/usr ./tests/install-test.sh
