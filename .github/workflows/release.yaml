name: Release (draft)

on:
  push:
    tags:
      - 'v*'
  # Lets the maintainer (re)run just the COPR publish jobs for a tag that
  # already has a release (draft or published) - e.g. resubmitting after a
  # COPR-side failure, or approving a publish that wasn't gated through at
  # tag-push time. Does not rebuild or recreate the GitHub Release itself;
  # `build-pkg`/`release` below stay tag-push only so a manual run can never
  # collide with an existing draft/release for the same tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish to COPR (e.g. v3.0.0-alpha7)'
        required: true

permissions:
  contents: write

jobs:
  # Single source of truth for "which tag are we operating on" - the pushed
  # tag on a tag-push trigger, or the given input on a manual run.
  prep:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        run: echo "ref=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  # Reuses install-test.yaml's build job: same real PKGBUILD/.spec/debian
  # build across the full distro matrix, so a tag ships exactly what CI
  # already verified installs cleanly, not a separately-built copy.
  build-pkg:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/build-pkg.yaml

  build-tarball:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/build-tarball.yaml

  # Signs SHA256SUMS of the prebuilt tarball(s) with the maintainer's SSH
  # signing key (verified by scripts/install.sh with `ssh-keygen -Y verify`).
  # Runs in the protected `release-signing` environment so the key is only
  # reachable by an approved release run. See docs/release-pipeline.md.
  sign-tarball:
    if: ${{ github.event_name == 'push' }}
    needs: build-tarball
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball-generic
          path: signed

      - name: Checksum and sign
        working-directory: signed
        env:
          SIGNING_KEY: ${{ secrets.LAM_RELEASE_SIGNING_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.LAM_RELEASE_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -e
          sha256sum -- *.tar.gz > SHA256SUMS
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::LAM_RELEASE_SIGNING_KEY is not set: SHA256SUMS is NOT signed, so scripts/install.sh will refuse to install this release."
            exit 0
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/sign_key"
          printf '#!/bin/sh\nprintf %%s "$SIGNING_KEY_PASSPHRASE"\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=none \
            ssh-keygen -Y sign -f "$RUNNER_TEMP/sign_key" -n lam-release SHA256SUMS
          rm -f "$RUNNER_TEMP/sign_key" "$RUNNER_TEMP/askpass"
          test -s SHA256SUMS.sig

      - uses: actions/upload-artifact@v7
        with:
          name: tarball-signed
          path: |
            signed/SHA256SUMS
            signed/SHA256SUMS.sig
          if-no-files-found: warn

  release:
    if: ${{ github.event_name == 'push' }}
    needs: [build-pkg, build-tarball, sign-tarball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Body = CHANGELOG.md's top-most "## [...]" section (normally
      # [Unreleased], already renamed to the version if the maintainer
      # bumped it before tagging) instead of GitHub's auto-generated
      # commit-list notes, which say nothing about *what* changed. This is
      # only the starting point - the maintainer edits the draft body by
      # hand before the publish-* jobs below read it back as the
      # authoritative changelog text (see docs/release-pipeline.md).
      - name: Extract changelog section for release notes
        run: python3 .github/scripts/changelog_section.py > /tmp/release-notes.md

      # No name: filter — pulls every pkg-<slug> artifact from this run,
      # each into its own subdirectory (artifact name), so same-family
      # packages never collide on disk even before the filename-uniqueness
      # fix in build-pkg.yaml.
      - uses: actions/download-artifact@v8
        with:
          path: pkg

      # The user-level installer travels as a release asset (not fetched from
      # a branch), so `releases/latest/download/install.sh` is always the
      # script that shipped with - and pins the signing key of - a real tag.
      - name: Add the user-level installer
        run: install -Dm755 scripts/install.sh pkg/installer/install.sh

      # Debug symbol packages (makepkg's auto-split "-debug-*" pkg.tar.zst,
      # dpkg's auto-generated "*-dbgsym_*.deb"; rpm's debuginfo/debugsource
      # are already dropped in build-pkg.yaml) aren't something end users
      # install. Source packages (rpm SRPM, a debian source upload's
      # .dsc/.orig.tar.*/.debian.tar.*) are redundant with the tag's own
      # source archive GitHub already offers on every release.
      - name: Drop debug and source packages from release assets
        run: |
          set -e
          find pkg -type f \
            ! -iname '*-debug-*.pkg.tar.zst' \
            ! -iname '*dbgsym*.deb' \
            ! -iname '*debuginfo*' \
            ! -iname '*debugsource*' \
            ! -iname '*.src.rpm' \
            ! -iname '*.src.tar.*' \
            ! -iname '*.dsc' \
            ! -iname '*.orig.tar.*' \
            ! -iname '*.debian.tar.*' \
            ! -iname '*_source.changes' \
            -print0 > /tmp/release-assets.list

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mapfile -d '' -t ASSETS < /tmp/release-assets.list
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes-file /tmp/release-notes.md \
            "${ASSETS[@]}"

  # Both publish jobs run on a tag push (right after the release draft is
  # created) and on a manual workflow_dispatch (targeting an existing tag's
  # existing release). `release` is tag-push-only, so on a dispatch run it's
  # `skipped`, not `success` - and a plain `needs: [prep, release]` job has
  # an *implicit* `if: success()`, which GitHub evaluates false when any
  # needed job was skipped rather than succeeded. Without the explicit
  # needs.release.result check below, both publish jobs silently no-op on
  # every manual dispatch (confirmed via a real run). See copr-publish.yaml
  # for the actual build+submit steps, and docs/release-pipeline.md for the
  # full design (channel naming, secrets, one-time setup).
  publish-stable:
    needs: [prep, release]
    if: ${{ !cancelled() && needs.prep.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && !contains(needs.prep.outputs.ref, '-') }}
    uses: ./.github/workflows/copr-publish.yaml
    with:
      ref: ${{ needs.prep.outputs.ref }}
      copr-project: elegos/linux-arctis-manager
      environment-name: release-stable
      finalize-release: ${{ github.event_name == 'push' }}
    secrets: inherit

  publish-unstable:
    needs: [prep, release]
    if: ${{ !cancelled() && needs.prep.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    uses: ./.github/workflows/copr-publish.yaml
    with:
      ref: ${{ needs.prep.outputs.ref }}
      copr-project: elegos/linux-arctis-manager-testing
      environment-name: release-testing
      finalize-release: false
    secrets: inherit
