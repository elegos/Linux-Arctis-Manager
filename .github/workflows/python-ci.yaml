name: Python CI

on:
  push:
  pull_request:

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: basedpyright
        run: uv run basedpyright

      - name: Tests + coverage
        run: uv run pytest --cov=src/linux_arctis_manager --cov-report=term-missing
