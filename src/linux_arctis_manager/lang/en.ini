vc_calib_title = Voice calibration
vc_calib_intro = Read the text below aloud, naturally, as if talking to a friend. Pause about two seconds between sentences and let your voice drop naturally at the end of each one.
vc_calib_text = Hello, my name is Ginny.
	Nine long mornings running, I remained alone.
	Yes, this is as simple as it seems.
	A perfectly packed paper cup popped at the top.
	Could you keep it up until the very end?
	And in the end… it slowly fades away.
vc_calib_intro_hint = Each sentence targets a different edge case (word endings, nasals, sibilants, plosives, questions, trail-offs). The recording stays on this computer.
