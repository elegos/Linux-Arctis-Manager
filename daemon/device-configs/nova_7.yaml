extends: base_arctis_nova_7

# Full capability tier: chatmix (hardware dial) + sidetone. Standard, WoW
# Edition and Diablo IV are cosmetic skins of the same board — confirmed
# protocol-identical against the raw spec (only fw_update PID/name differ).
# 7X and 7X White are the Xbox-certified SKU (and its cosmetic skin) — unlike
# the Arctis 7+ family, this device's raw spec does NOT strip chatmix or
# sidetone from the Xbox tier; headset_status and sidetone are never
# redefined per-SKU, only per real-capability-tier (7P, see nova_7p.yaml).

structs:
  sidetone:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0x39}
    - name: sidetone
      type: uint8
      range: [0, 3]
      values_mapping: {"0": "off", "1": "low", "2": "medium", "3": "high"}

  headset_status:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x00}
      - {name: command,   type: uint8, constant: 0xB0}
    incoming:
      - {name: report_id,          type: uint8, constant: 0x00}
      - {name: command,            type: uint8, constant: 0xB0}
      - {name: connection_status,  type: uint8, range: [0, 3]}
      - {name: battery_status,     type: uint8, range: [0, 4]}
      - {name: charging_status,    type: uint8, range: [0, 3]}
      - {name: game_chatmix_level, type: uint8, range: [0, 100]}
      - {name: chat_chatmix_level, type: uint8, range: [0, 100]}

apis:
  sidetone:
    write: {transport: HID_IO, chunk_size: 65}
  headset_status:
    read: {transport: HID_IO, chunk_size: 65}

sync_events:
  0x45:
    emit: chatmix_changed
    fields:
      - {name: game_chatmix_level, byte: 2}
      - {name: chat_chatmix_level, byte: 3}

  0xB7:
    emit: battery_changed
    fields:
      - {name: battery_status, byte: 2, transform: battery_level_to_percent, display_type: percentage}

  0xB9:
    emit: connection_changed
    fields:
      - {name: connection_status, byte: 2, transform: connection_status_to_label}

  0xBB:
    emit: charging_changed
    fields:
      - {name: charging_status, byte: 2, transform: charging_status_to_label}

sync_read:
  - struct: headset_status
    maps:
      - {emit: connection_changed, field: connection_status, transform: connection_status_to_label}
      - {emit: battery_changed,    field: battery_status,     transform: battery_level_to_percent, display_type: percentage}
      - {emit: charging_changed,   field: charging_status,    transform: charging_status_to_label}
      - emit: chatmix_changed
        fields: [game_chatmix_level, chat_chatmix_level]

device:
  name: "SteelSeries Arctis Nova 7"
  vendor_id: 0x1038

  # NOTE ON command_interface/sync_interface: same discrepancy pattern as
  # Nova 5/Arctis 7+ — the raw spec only declares a sync interface (5,
  # usage-page 0xFF00), never a command interface. v2 (real hardware, PyUSB)
  # found command_interface_index [0, 3] (interface 3) and only ever
  # listened on interface 3, not 5. Trusting v2 fully here (command AND sync
  # both on 3), same call made for Arctis 7+. Wants confirming on real
  # hardware.
  variants:
    - product_id: 0x2202
      name: "Arctis Nova 7"
      bootloader_pid: 0x2203
    - product_id: 0x227A
      name: "Arctis Nova 7 (WoW Edition)"
      bootloader_pid: 0x227B
    - product_id: 0x223A
      name: "Arctis Nova 7 (Diablo IV Edition)"
      bootloader_pid: 0x223B
    - product_id: 0x2206
      name: "Arctis Nova 7X"
      bootloader_pid: 0x2207
    - product_id: 0x2258
      name: "Arctis Nova 7X (white)"
      bootloader_pid: 0x2259

  hid:
    usage_page: 0xFFC0
    usage: 0x0001
    command_interface:
      interface: 3
    sync_interface:
      interface: 3

  capabilities:
    - battery
    - chatmix
    - custom_eq
    - microphone
