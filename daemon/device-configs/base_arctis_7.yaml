transforms:
  # Only two real states on the wire (3 connected / 1 disconnected) — not the
  # 4-state NOT_PAIRED/PAIRED enum used by the Arctis 7+ family's
  # connection_status_to_label, which is why this is its own transform
  # rather than a reuse.
  arctis_7_connection_to_label:
    type: case_int_to_str
    default: UNKNOWN
    values: {1: DISCONNECTED, 3: CONNECTED}

structs:
  # Shared by both hardware revisions this family covers (2018 original and
  # the "2019 refresh") — confirmed protocol-identical against the raw spec,
  # the 2019 revision's own spec file literally `include`s the 2018 one and
  # only overrides the PID/firmware filename. report_id is 0x06 on every
  # struct here (unlike the Arctis 7+/Nova 7 gen1 families, which always use
  # 0x00 in that position) — that's what the raw spec declares, not a typo.
  mic_volume:
    - {name: report_id, type: uint8, constant: 0x06}
    - {name: command,   type: uint8, constant: 0x33}
    - {name: val,       type: uint8, constant: 0x00}
    - {name: mic_volume, type: uint8, range: [0, 100]}

  sidetone:
    - {name: report_id, type: uint8, constant: 0x06}
    - {name: command,   type: uint8, constant: 0x35}
    - {name: enabled,   type: uint8, range: [0, 1]}
    - {name: val,       type: uint8, constant: 0x00}
    - {name: amplitude, type: uint8, range: [0, 100]}

  inactivity_timer:
    - {name: report_id, type: uint8, constant: 0x06}
    - {name: command,   type: uint8, constant: 0x51}
    - {name: inactivity_timer, type: uint8, range: [0, 255]}

  # Mute-LED behaviour on the base station: 0 off, 1 solid, 2 breathing —
  # set independently for the "headset connected" and "headset disconnected"
  # states.
  tx_led:
    - {name: report_id,   type: uint8, constant: 0x06}
    - {name: command,     type: uint8, constant: 0x55}
    - {name: connected,   type: uint8, range: [0, 2]}
    - {name: disconnected, type: uint8, range: [0, 2]}

  mute_illumination:
    - {name: report_id, type: uint8, constant: 0x06}
    - {name: command,   type: uint8, constant: 0x45}
    - name: option
      type: uint8
      range: [1, 2]
      values_mapping: {"1": "steady", "2": "breathing"}

  connection_status:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x14}
    incoming:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x14}
      - {name: connection, type: uint8, range: [1, 3]}

  battery_status:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x18}
    incoming:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x18}
      - {name: battery,   type: uint8, range: [0, 100]}

  game_chat_status:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x24}
    incoming:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x24}
      - {name: game, type: uint8, range: [0, 100]}
      - {name: chat, type: uint8, range: [0, 100]}

  mic_status:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x30}
    incoming:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x30}
      - {name: mic_muted, type: uint8, range: [0, 1]} # 0 unmuted, 1 muted

  fw_versions:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x10}
    incoming:
      - {name: report_id, type: uint8, constant: 0x06}
      - {name: command,   type: uint8, constant: 0x10}
      - {name: fw_minor,         type: uint8}
      - {name: fw_major,         type: uint8}
      - {name: fw_minor_headset, type: uint8}
      - {name: fw_major_headset, type: uint8}

  reset:
    - {name: report_id, type: uint8, constant: 0x06}
    - {name: command,   type: uint8, constant: 0x01}

  save_to_flash:
    - {name: report_id, type: uint8, constant: 0x06}
    - {name: command,   type: uint8, constant: 0x09}

  # AV6X02 driver-computed biquad EQ — the firmware does no coefficient math
  # of its own, `builtin:av6x02_eq_gains` computes RBJ-cookbook filter
  # coefficients from these 6 gains and streams them as raw register writes.
  # Same struct/builtin as Arctis 1 Wireless (base_arctis_1_wireless.yaml) —
  # this is the actual EQ this device has; the README's older "fixed AVNERA
  # curve" claim was wrong.
  custom_eq:
    - {name: report_id, type: uint8,  constant: 0x06}
    - {name: command,   type: uint8,  constant: 0x28}
    - {name: gain1,     type: float32, range: [-12.0, 12.0]}
    - {name: gain2,     type: float32, range: [-12.0, 12.0]}
    - {name: gain3,     type: float32, range: [-12.0, 12.0]}
    - {name: gain4,     type: float32, range: [-12.0, 12.0]}
    - {name: gain5,     type: float32, range: [-12.0, 12.0]}
    - {name: gain6,     type: float32, range: [-12.0, 12.0]}

  # One-time AV6X02 DRC/filter-bank init sequence — every byte is a
  # chip-intrinsic constant (see `builtin:av6x02_init`), this struct exists
  # only so the api has something to serialise/pad; the builtin ignores it.
  av6x02_init:
    - {name: report_id, type: uint8, constant: 0x06}

apis:
  mic_volume:
    write: {transport: HID_IO, chunk_size: 31}
  sidetone:
    write: {transport: HID_IO, chunk_size: 31}
  inactivity_timer:
    write: {transport: HID_IO, chunk_size: 31}
  tx_led:
    write: {transport: HID_IO, chunk_size: 31}
  mute_illumination:
    write: {transport: HID_IO, chunk_size: 31}
  connection_status:
    read: {transport: HID_IO, chunk_size: 31}
  battery_status:
    read: {transport: HID_IO, chunk_size: 31}
  game_chat_status:
    read: {transport: HID_IO, chunk_size: 31}
  mic_status:
    read: {transport: HID_IO, chunk_size: 31}
  fw_versions:
    read: {transport: HID_IO, chunk_size: 31}
  reset:
    action: true
    write: {transport: HID_IO, chunk_size: 31}
  save_to_flash:
    write: {transport: HID_IO, chunk_size: 31}
  custom_eq:
    write:
      transport: HID_IO
      chunk_size: 31
      payload_transform: "builtin:av6x02_eq_gains"
  av6x02_init:
    write:
      transport: HID_IO
      chunk_size: 31
      payload_transform: "builtin:av6x02_init"

sync_read:
  - struct: connection_status
    maps:
      - {emit: connection_changed, field: connection, transform: arctis_7_connection_to_label}
  - struct: battery_status
    maps:
      - {emit: battery_changed, field: battery, display_type: percentage}
  - struct: game_chat_status
    maps:
      - emit: chatmix_changed
        fields: [game, chat]
  - struct: mic_status
    maps:
      - {emit: mic_muted_changed, field: mic_muted, display_type: on_off}

lifecycle:
  # Mirrors the vendor spec's own `custom-init`: initialize the AV6X02
  # filter bank/DRC once per connection. No Sonar/software-chatmix structs
  # on this device — nothing to disable.
  init:
    - call: av6x02_init
    - call: discord_certified_set_attributes
      args: {echo_cancellation: true, noise_suppression: true}
  shutdown:
    - call: save_to_flash
