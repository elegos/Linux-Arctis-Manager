# The richer "gen2" wire protocol shared by real Gen 2 hardware and by
# gen1-hardware units running the "upgrade" firmware (see nova_7_gen2.yaml
# for the PID list and why they're the same device file). Percentage
# battery (vs. gen1's 0/25/50/75/100 steps), a 3-domain (2.4GHz/Bluetooth/
# mic) parametric EQ with a 3-message compound write, live mic-mute and
# Bluetooth-link status. sidetone is defined directly in this base (unlike
# gen1, where it's per-SKU) — every SKU in this family has it, including 7P.
#
# EQ *readback* (current preset name/curve, `read_eq_preset_name`/
# `get_eq_preset_data`, RF/BT/mic domains) is now modelled too, using the
# `int8` field type ([E7-S12]) the wire format's raw gain byte needs. Like
# every other shipped EQ device, it's declared for structural completeness
# but not wired into `sync_read` — this daemon always resets EQ to a known
# state on init rather than restoring the hardware's persisted curve. EQ
# *write* is modelled below using the multi-step/varstring primitives.
#
# "RGB color spin" was flagged during scoping as a possible new capability —
# turned out not to be one: the vendor spec's own `translate_color_spin`
# function is `'()`, an unconditional no-op stub. There's no real lighting
# feature behind `read_color_spin` (cmd 0x14) to expose, so it isn't modelled.

transforms:
  connection_status_to_label:
    type: case_int_to_str
    default: UNKNOWN
    values: {0: NOT_PAIRED_NOT_SEARCHING, 1: NOT_PAIRED_SEARCHING, 2: PAIRED_NOT_CONNECTED, 3: PAIRED_CONNECTED}

  charging_status_to_label:
    type: case_int_to_str
    default: UNKNOWN
    values: {0: UNKNOWN_OR_HEADSET_NOT_CONNECTED, 1: PLUGGED_IN_CHARGING, 2: PLUGGED_IN_NOT_CHARGING, 3: DISCHARGING}

structs:
  mic_volume:
    - {name: report_id,  type: uint8, constant: 0x00}
    - {name: command,    type: uint8, constant: 0x37}
    - {name: mic_volume, type: uint8, range: [0, 7]}

  sidetone:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0x39}
    - name: sidetone
      type: uint8
      range: [0, 3]
      values_mapping: {"0": "off", "1": "low", "2": "medium", "3": "high"}

  volume_limiter:
    - {name: report_id,      type: uint8, constant: 0x00}
    - {name: command,        type: uint8, constant: 0x3A}
    - {name: volume_limiter, type: uint8, range: [0, 1]}

  muted_mic_brightness:
    - {name: report_id,             type: uint8, constant: 0x00}
    - {name: command,               type: uint8, constant: 0xAE}
    - {name: muted_mic_brightness,  type: uint8, range: [0, 3]}

  power_inactivity_timer:
    - {name: report_id,             type: uint8, constant: 0x00}
    - {name: command,               type: uint8, constant: 0xA3}
    - {name: power_inactivity_timer, type: uint8, range: [0, 255]}

  bt_power_default:
    - {name: report_id,        type: uint8, constant: 0x00}
    - {name: command,          type: uint8, constant: 0xB2}
    - {name: bt_power_default, type: uint8, range: [0, 1]}

  bt_call_default:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0xB3}
    - name: bt_call_default
      type: uint8
      range: [0, 2]
      values_mapping: {"0": "none", "1": "attenuate_12db", "2": "mute"}

  # The FW needs the write itself, THEN blocks all commands for 1.5s — the
  # opposite order from Nova Elite's save_to_flash, which sleeps BEFORE.
  save_to_flash:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0x09}

  # One-shot factory-reset trigger — an action, not a persisted setting.
  # Exposed via the `TriggerAction` D-Bus method ([E7-S9]), e.g.
  # `TriggerAction("restore_factory_default", "")`.
  restore_factory_default:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0xFD}

  audio_settings:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x00}
      - {name: command,   type: uint8, constant: 0x20}
    incoming:
      - {name: report_id,      type: uint8, constant: 0x00}
      - {name: command,        type: uint8, constant: 0x20}
      - {name: mic_volume,     type: uint8, range: [0, 7]}
      - {name: sidetone,       type: uint8, range: [0, 3]}
      - {name: volume_limiter, type: uint8, range: [0, 1]}

  ux_settings:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x00}
      - {name: command,   type: uint8, constant: 0xA0}
    incoming:
      - {name: report_id,              type: uint8, constant: 0x00}
      - {name: command,                type: uint8, constant: 0xA0}
      - {name: power_inactivity_timer, type: uint8, range: [0, 255]}
      - {name: muted_mic_brightness,   type: uint8, range: [0, 3]}

  headset_status:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x00}
      - {name: command,   type: uint8, constant: 0xB0}
    incoming:
      - {name: report_id,          type: uint8, constant: 0x00}
      - {name: command,            type: uint8, constant: 0xB0}
      - {name: connection_status,  type: uint8, range: [0, 3]}
      # Percentage battery (vs. gen1's discrete 0/25/50/75/100 steps) — no
      # case-transform needed, the firmware already sends 1-100 directly.
      - {name: battery_status,     type: uint8, range: [1, 100]}
      - {name: charging_status,    type: uint8, range: [0, 3]}
      - {name: game_chatmix_level, type: uint8, range: [0, 100]}
      - {name: chat_chatmix_level, type: uint8, range: [0, 100]}
      - {name: unused,             type: uint8}
      - {name: bt_power_default,   type: uint8, range: [0, 1]}
      - {name: bt_call_default,    type: uint8, range: [0, 2]}
      - {name: mic_mute,           type: uint8, range: [0, 255]}

  # 10-band parametric EQ (frequency/filter-type/gain/Q-factor per band,
  # like Nova 5's — not the fixed-frequency graphic EQ used by every other
  # family so far). One struct per domain (2.4GHz/Bluetooth/mic), matching
  # the vendor spec's own `derived-struct`/`connection_type` split, so each
  # stays independently addressable exactly as in the original driver.
  # Write-only: presets are read back via `get_eq_preset_data`/
  # `read_eq_preset_name`, not modelled here — see the file header.
  #
  # This is genuinely a multi-message write, not one packet: the firmware
  # expects the preset name, then the band data, then a commit trigger, as
  # three separate HID reports. `apis:` below expresses this as a 3-step
  # `write.steps` sequence, each step slicing a different part of this same
  # serialisation via its own `payload_transform` builtin — see
  # `parametric_eq_{name,bands,commit}_payload` (generic, parameterised via
  # `payload_transform_args`) in builtins.rs for exactly
  # which bytes each step picks out and how gain/Q-factor get re-encoded
  # into the firmware's compact per-band wire format.
  # Shared by all three write-side domains below via `{struct:
  # parametric_eq_bands}` — they're byte-identical band groups (the vendor
  # spec's own `parametric_eq_bt`/`parametric_eq_mic` are `derived-struct`s
  # of `parametric_eq`, same field ranges).
  parametric_eq_bands:
    - {name: band1_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band1_filter_type, type: uint8,   range: [0, 6]}
    - {name: band1_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band1_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band2_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band2_filter_type, type: uint8,   range: [0, 6]}
    - {name: band2_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band2_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band3_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band3_filter_type, type: uint8,   range: [0, 6]}
    - {name: band3_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band3_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band4_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band4_filter_type, type: uint8,   range: [0, 6]}
    - {name: band4_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band4_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band5_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band5_filter_type, type: uint8,   range: [0, 6]}
    - {name: band5_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band5_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band6_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band6_filter_type, type: uint8,   range: [0, 6]}
    - {name: band6_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band6_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band7_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band7_filter_type, type: uint8,   range: [0, 6]}
    - {name: band7_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band7_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band8_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band8_filter_type, type: uint8,   range: [0, 6]}
    - {name: band8_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band8_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band9_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band9_filter_type, type: uint8,   range: [0, 6]}
    - {name: band9_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band9_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band10_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band10_filter_type, type: uint8,   range: [0, 6]}
    - {name: band10_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band10_q_factor,    type: float32, range: [0.2, 10.0]}

  parametric_eq:
    - {name: report_id,        type: uint8, constant: 0x00}
    - {name: eq_name_command,  type: uint8, constant: 0xA7}
    - {name: connection_type,  type: uint8, constant: 0x00}
    - {name: preset_type,      type: uint8, range: [0, 1]}
    - {name: eqband_command,   type: uint8, constant: 0x33}
    - {name: update_complete,  type: uint8, constant: 0x27}
    - {struct: parametric_eq_bands}
    - {name: name, type: varstring, size: 60}

  parametric_eq_bt:
    - {name: report_id,        type: uint8, constant: 0x00}
    - {name: eq_name_command,  type: uint8, constant: 0xA7}
    - {name: connection_type,  type: uint8, constant: 0x01}
    - {name: preset_type,      type: uint8, range: [0, 1]}
    - {name: eqband_command,   type: uint8, constant: 0x33}
    - {name: update_complete,  type: uint8, constant: 0x27}
    - {struct: parametric_eq_bands}
    - {name: name, type: varstring, size: 60}

  parametric_eq_mic:
    - {name: report_id,        type: uint8, constant: 0x00}
    - {name: eq_name_command,  type: uint8, constant: 0xA7}
    - {name: connection_type,  type: uint8, constant: 0x02}
    - {name: preset_type,      type: uint8, range: [0, 1]}
    - {name: eqband_command,   type: uint8, constant: 0x33}
    - {name: update_complete,  type: uint8, constant: 0x27}
    - {struct: parametric_eq_bands}
    - {name: name, type: varstring, size: 60}

  # Readback of the currently active preset's name (RF/BT/mic domains) — the
  # DSL blocker this needed (a signed `int8` field type for the paired
  # get_eq_preset_data struct's gain byte, below) is resolved ([E7-S12]).
  # Bidir: outgoing is the read-request (report_id/command/connection_type,
  # all constant per domain since a read's outgoing bytes are serialised
  # with an empty values map — see api_executor.rs::prepare_read), incoming
  # is the device's response. Matches every other shipped EQ device: declared
  # for structural completeness, not wired into sync_read — this daemon
  # always resets EQ to a known state on init rather than restoring the
  # hardware's persisted curve/name.
  read_eq_preset_name:
    outgoing:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0xA6}
      - {name: connection_type, type: uint8, constant: 0x00}
    incoming:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0xA6}
      - {name: connection_type, type: uint8, constant: 0x00}
      - {name: preset_type,     type: uint8, range: [0, 1]}
      - {name: name,            type: bytearray, size: 61}

  read_eq_preset_name_bt:
    outgoing:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0xA6}
      - {name: connection_type, type: uint8, constant: 0x01}
    incoming:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0xA6}
      - {name: connection_type, type: uint8, constant: 0x01}
      - {name: preset_type,     type: uint8, range: [0, 1]}
      - {name: name,            type: bytearray, size: 61}

  read_eq_preset_name_mic:
    outgoing:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0xA6}
      - {name: connection_type, type: uint8, constant: 0x02}
    incoming:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0xA6}
      - {name: connection_type, type: uint8, constant: 0x02}
      - {name: preset_type,     type: uint8, range: [0, 1]}
      - {name: name,            type: bytearray, size: 61}

  # Readback of the currently active preset's full band curve (RF/BT/mic).
  # `gain` decodes as a raw signed byte (0.1 dB units, e.g. `0xF4` = -1.2 dB)
  # via the new `int8` field type — the actual blocker this story closes;
  # `q_factor` is declared plain big-endian `uint16` here, matching the raw
  # spec's bare `(field q_factor uint16 (range 200 10000))` on this incoming
  # struct — but the same spec's write-side encoder has an explicit comment
  # that Q-factor is stored little-endian on the wire. It's unclear whether
  # that only describes the outgoing byte-twiddling (already handled by
  # `nova7gen2_eq_bands_payload`, not the generic codec) or the physical
  # wire format read back here too; kept as literally declared, flagged for
  # verification against real hardware. Same not-wired-to-sync_read
  # convention as read_eq_preset_name above. The vendor spec also flags a
  # known firmware quirk on this incoming layout ("TODO: remove after FW
  # fix missing byte") — kept as literally specified, unconfirmed too.
  get_eq_preset_data:
    outgoing:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0x32}
      - {name: connection_type, type: uint8, constant: 0x00}
    incoming:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0x32}
      - {name: connection_type, type: uint8, constant: 0x00}
      - {name: band1_frequency,   type: uint16, range: [20, 20001]}
      - {name: band1_filter_type, type: uint8,  range: [0, 6]}
      - {name: band1_gain,        type: int8}
      - {name: band1_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band2_frequency,   type: uint16, range: [20, 20001]}
      - {name: band2_filter_type, type: uint8,  range: [0, 6]}
      - {name: band2_gain,        type: int8}
      - {name: band2_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band3_frequency,   type: uint16, range: [20, 20001]}
      - {name: band3_filter_type, type: uint8,  range: [0, 6]}
      - {name: band3_gain,        type: int8}
      - {name: band3_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band4_frequency,   type: uint16, range: [20, 20001]}
      - {name: band4_filter_type, type: uint8,  range: [0, 6]}
      - {name: band4_gain,        type: int8}
      - {name: band4_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band5_frequency,   type: uint16, range: [20, 20001]}
      - {name: band5_filter_type, type: uint8,  range: [0, 6]}
      - {name: band5_gain,        type: int8}
      - {name: band5_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band6_frequency,   type: uint16, range: [20, 20001]}
      - {name: band6_filter_type, type: uint8,  range: [0, 6]}
      - {name: band6_gain,        type: int8}
      - {name: band6_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band7_frequency,   type: uint16, range: [20, 20001]}
      - {name: band7_filter_type, type: uint8,  range: [0, 6]}
      - {name: band7_gain,        type: int8}
      - {name: band7_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band8_frequency,   type: uint16, range: [20, 20001]}
      - {name: band8_filter_type, type: uint8,  range: [0, 6]}
      - {name: band8_gain,        type: int8}
      - {name: band8_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band9_frequency,   type: uint16, range: [20, 20001]}
      - {name: band9_filter_type, type: uint8,  range: [0, 6]}
      - {name: band9_gain,        type: int8}
      - {name: band9_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band10_frequency,   type: uint16, range: [20, 20001]}
      - {name: band10_filter_type, type: uint8,  range: [0, 6]}
      - {name: band10_gain,        type: int8}
      - {name: band10_q_factor,    type: uint16, range: [200, 10000]}

  get_eq_preset_data_bt:
    outgoing:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0x32}
      - {name: connection_type, type: uint8, constant: 0x01}
    incoming:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0x32}
      - {name: connection_type, type: uint8, constant: 0x01}
      - {name: band1_frequency,   type: uint16, range: [20, 20001]}
      - {name: band1_filter_type, type: uint8,  range: [0, 6]}
      - {name: band1_gain,        type: int8}
      - {name: band1_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band2_frequency,   type: uint16, range: [20, 20001]}
      - {name: band2_filter_type, type: uint8,  range: [0, 6]}
      - {name: band2_gain,        type: int8}
      - {name: band2_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band3_frequency,   type: uint16, range: [20, 20001]}
      - {name: band3_filter_type, type: uint8,  range: [0, 6]}
      - {name: band3_gain,        type: int8}
      - {name: band3_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band4_frequency,   type: uint16, range: [20, 20001]}
      - {name: band4_filter_type, type: uint8,  range: [0, 6]}
      - {name: band4_gain,        type: int8}
      - {name: band4_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band5_frequency,   type: uint16, range: [20, 20001]}
      - {name: band5_filter_type, type: uint8,  range: [0, 6]}
      - {name: band5_gain,        type: int8}
      - {name: band5_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band6_frequency,   type: uint16, range: [20, 20001]}
      - {name: band6_filter_type, type: uint8,  range: [0, 6]}
      - {name: band6_gain,        type: int8}
      - {name: band6_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band7_frequency,   type: uint16, range: [20, 20001]}
      - {name: band7_filter_type, type: uint8,  range: [0, 6]}
      - {name: band7_gain,        type: int8}
      - {name: band7_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band8_frequency,   type: uint16, range: [20, 20001]}
      - {name: band8_filter_type, type: uint8,  range: [0, 6]}
      - {name: band8_gain,        type: int8}
      - {name: band8_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band9_frequency,   type: uint16, range: [20, 20001]}
      - {name: band9_filter_type, type: uint8,  range: [0, 6]}
      - {name: band9_gain,        type: int8}
      - {name: band9_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band10_frequency,   type: uint16, range: [20, 20001]}
      - {name: band10_filter_type, type: uint8,  range: [0, 6]}
      - {name: band10_gain,        type: int8}
      - {name: band10_q_factor,    type: uint16, range: [200, 10000]}

  get_eq_preset_data_mic:
    outgoing:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0x32}
      - {name: connection_type, type: uint8, constant: 0x02}
    incoming:
      - {name: report_id,       type: uint8, constant: 0x00}
      - {name: command,         type: uint8, constant: 0x32}
      - {name: connection_type, type: uint8, constant: 0x02}
      - {name: band1_frequency,   type: uint16, range: [20, 20001]}
      - {name: band1_filter_type, type: uint8,  range: [0, 6]}
      - {name: band1_gain,        type: int8}
      - {name: band1_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band2_frequency,   type: uint16, range: [20, 20001]}
      - {name: band2_filter_type, type: uint8,  range: [0, 6]}
      - {name: band2_gain,        type: int8}
      - {name: band2_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band3_frequency,   type: uint16, range: [20, 20001]}
      - {name: band3_filter_type, type: uint8,  range: [0, 6]}
      - {name: band3_gain,        type: int8}
      - {name: band3_q_factor,    type: uint16, range: [200, 10000]}
      - {name: band4_frequency,   type: uint16, range: [20, 20001]}
      - {name: band4_filter_type, type: uint8,  range: [0, 6]}
