apis:
  mic_volume:
    write: {transport: HID_IO, chunk_size: 65}
  sidetone:
    write: {transport: HID_IO, chunk_size: 65}
  volume_limiter:
    write: {transport: HID_IO, chunk_size: 65}
  muted_mic_brightness:
    write: {transport: HID_IO, chunk_size: 65}
  power_inactivity_timer:
    write: {transport: HID_IO, chunk_size: 65}
  bt_power_default:
    write: {transport: HID_IO, chunk_size: 65}
  bt_call_default:
    write: {transport: HID_IO, chunk_size: 65}
  restore_factory_default:
    action: true
    write: {transport: HID_IO, chunk_size: 65}

  save_to_flash:
    write:
      steps:
        - {transport: HID_IO, chunk_size: 65}
        - {sleep_ms: 1500}

  audio_settings:
    read: {transport: HID_IO, chunk_size: 65}
  ux_settings:
    read: {transport: HID_IO, chunk_size: 65}
  headset_status:
    read: {transport: HID_IO, chunk_size: 65}

  read_eq_preset_name:
    read: {transport: HID_IO, chunk_size: 65}
  read_eq_preset_name_bt:
    read: {transport: HID_IO, chunk_size: 65}
  read_eq_preset_name_mic:
    read: {transport: HID_IO, chunk_size: 65}
  get_eq_preset_data:
    read: {transport: HID_IO, chunk_size: 65}
  get_eq_preset_data_bt:
    read: {transport: HID_IO, chunk_size: 65}
  get_eq_preset_data_mic:
    read: {transport: HID_IO, chunk_size: 65}

  # `header_len: 6` (report_id, eq_name_command, connection_type,
  # preset_type, eqband_command, update_complete), `commit_byte_offset: 5` —
  # shared by all three domains, only `connection_type`'s constant (baked
  # into each struct above) differs.
  parametric_eq:
    write:
      steps:
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:parametric_eq_name", payload_transform_args: {header_len: 6, band_count: 10}}
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:parametric_eq_bands", payload_transform_args: {header_len: 6, band_count: 10, gain_flavour: signed_tenths_db}}
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:parametric_eq_commit", payload_transform_args: {commit_byte_offset: 5}}
  parametric_eq_bt:
    write:
      steps:
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:parametric_eq_name", payload_transform_args: {header_len: 6, band_count: 10}}
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:parametric_eq_bands", payload_transform_args: {header_len: 6, band_count: 10, gain_flavour: signed_tenths_db}}
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:parametric_eq_commit", payload_transform_args: {commit_byte_offset: 5}}
  parametric_eq_mic:
    write:
      steps:
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:parametric_eq_name", payload_transform_args: {header_len: 6, band_count: 10}}
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:parametric_eq_bands", payload_transform_args: {header_len: 6, band_count: 10, gain_flavour: signed_tenths_db}}
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:parametric_eq_commit", payload_transform_args: {commit_byte_offset: 5}}

sync_events:
  0x37:
    emit: mic_volume_changed
    fields:
      - {name: mic_volume, byte: 2}

  0x39:
    emit: sidetone_changed
    fields:
      - {name: sidetone, byte: 2}

  0x3A:
    emit: volume_limiter_changed
    fields:
      - {name: volume_limiter, byte: 2, display_type: on_off}

  0xA3:
    emit: power_inactivity_timer_changed
    fields:
      - {name: power_inactivity_timer, byte: 2}

  0xAE:
    emit: muted_mic_brightness_changed
    fields:
      - {name: muted_mic_brightness, byte: 2}

  0xB2:
    emit: bt_power_default_changed
    fields:
      - {name: bt_power_default, byte: 2, display_type: on_off}

  0xB3:
    emit: bt_call_default_changed
    fields:
      - {name: bt_call_default, byte: 2}

  0x45:
    emit: chatmix_changed
    fields:
      - {name: game_chatmix_level, byte: 2}
      - {name: chat_chatmix_level, byte: 3}

  # Unlike every other live event on this device, the state byte is at
  # offset 3, not 2 — matches the vendor spec's own
  # `(handle_mic_mute_event (extract-byte payload 3))` exactly.
  0x52:
    emit: mic_mute_changed
    fields:
      - {name: mic_mute, byte: 3, display_type: on_off}

  # Bluetooth link status: mode (off/pairing/link) and status (ready/lost/
  # busy/error, only meaningful when mode=link) are reported as raw values,
  # not combined into one label — the vendor spec's own decoder nests mode
  # and status together (status only means something for one mode value),
  # which this DSL's single-field case-transform can't express.
  0xB5:
    emit: bt_connection_changed
    fields:
      - {name: bt_mode,   byte: 2}
      - {name: bt_status, byte: 3}

  0xB7:
    emit: battery_changed
    fields:
      - {name: battery_status, byte: 2, display_type: percentage}

  0xB9:
    emit: connection_changed
    fields:
      - {name: connection_status, byte: 2, transform: connection_status_to_label}

  0xBB:
    emit: charging_changed
    fields:
      - {name: charging_status, byte: 2, transform: charging_status_to_label}

sync_read:
  - struct: headset_status
    maps:
      - {emit: connection_changed,      field: connection_status, transform: connection_status_to_label}
      - {emit: battery_changed,         field: battery_status,    display_type: percentage}
      - {emit: charging_changed,        field: charging_status,   transform: charging_status_to_label}
      - {emit: bt_power_default_changed, field: bt_power_default, display_type: on_off}
      - {emit: bt_call_default_changed, field: bt_call_default}
      - {emit: mic_mute_changed,        field: mic_mute,          display_type: on_off}
      - emit: chatmix_changed
        fields: [game_chatmix_level, chat_chatmix_level]

  - struct: audio_settings
    maps:
      - {emit: mic_volume_changed,     field: mic_volume}
      - {emit: sidetone_changed,       field: sidetone}
      - {emit: volume_limiter_changed, field: volume_limiter, display_type: on_off}

  - struct: ux_settings
    maps:
      - {emit: power_inactivity_timer_changed, field: power_inactivity_timer}
      - {emit: muted_mic_brightness_changed,   field: muted_mic_brightness}

lifecycle:
  init:
    # LAM does not provide SteelSeries Sonar — this device has no
    # set_sonar_present/software_chatmix_status struct at all, nothing to
    # disable. No EQ reset to flat: readback isn't modelled (see file
    # header), so the daemon has no way to know the device's current curve.
    - call: discord_certified_set_attributes
      args: {echo_cancellation: true, noise_suppression: true}
  shutdown:
    - call: save_to_flash
