extends: base_arctis_nova_7_gen2

# Real Gen 2 hardware and gen1-hardware-with-"upgrade"-firmware share the
# exact same wire protocol — confirmed by diffing the raw specs, each
# "upgrade" .device file `include`s the same base_arctis_nova_7_gen2_tx as
# the native Gen 2 SKUs, only its PID differs (and it keeps its gen1-era
# bootloader PID for the in-place flash step). No per-SKU protocol
# differences found anywhere in this family (unlike gen1's 7P, sidetone is
# defined in the shared base here, not per-SKU) — one device file for all
# 9 PIDs. One raw discrepancy needing hardware confirmation before this
# ships: v2's product_ids list includes 0x22a4, which the raw spec assigns
# to the 7X upgrade *RX* (not TX) — possibly a v2 typo (0x22a5 is the
# matching TX PID), possibly a real enumeration quirk of this specific SKU.

device:
  name: "SteelSeries Arctis Nova 7 (Gen 2 protocol)"
  vendor_id: 0x1038

  # sync_interface CONFIRMED as 5, not 3 — unlike nova_7.yaml's still-open
  # "trusting v2 over spec" note, this one has real-hardware evidence: a
  # GitHub bug report (PID 0x22A1, real device) showed device_init hanging
  # forever with zero async notifications ever received on interface 3, even
  # though the headset was confirmably connected (audio played fine through
  # it the whole time). The reporter's own hid-descriptor capture confirms
  # interface 5 exists with usage-page 0xFF00 — exactly matching the decoded
  # vendor spec's `(sync-interface 0xff00 0x0001 5)` directive for this PID.
  # v2 never actually validates its "listens on 3 only" choice for this
  # family either (its `nova_7_wireless_perc_battery.yaml` is gen1's protocol
  # replayed against gen2 hardware, see [[project-v3-device-import]]) and its
  # polling loop doesn't depend on catching a real async wake event the way
  # v3's reconnect loop does, so it was never good evidence here. Same fix
  # applied to nova_7.yaml (gen1) and nova_7p.yaml — every Nova 7 family raw
  # spec file (all 15 TX variants) declares the identical sync-interface 5,
  # zero per-SKU exceptions, so this isn't a gen2-specific finding. The
  # separate Arctis 7+ family (arctis_7_plus.yaml et al, different base
  # protocol) shows the same pattern but was NOT changed — no equivalent
  # real-hardware confirmation for that family yet.
  variants:
    - product_id: 0x227E
      name: "Arctis Nova 7 Gen 2"
      bootloader_pid: 0x227F
    - product_id: 0x229E
      name: "Arctis Nova 7X Gen 2"
      bootloader_pid: 0x229F
    - product_id: 0x2298
      name: "Arctis Nova 7P Gen 2"
      bootloader_pid: 0x2299
    - product_id: 0x22A1
      name: "Arctis Nova 7 (Gen 2 firmware)"
      bootloader_pid: 0x2203
    - product_id: 0x22A5
      name: "Arctis Nova 7X (Gen 2 firmware)"
      bootloader_pid: 0x2207
    - product_id: 0x22AD
      name: "Arctis Nova 7X White (Gen 2 firmware)"
      bootloader_pid: 0x2259
    - product_id: 0x22A7
      name: "Arctis Nova 7P (Gen 2 firmware)"
      bootloader_pid: 0x220B
    - product_id: 0x22AB
      name: "Arctis Nova 7 WoW Edition (Gen 2 firmware)"
      bootloader_pid: 0x227B
    - product_id: 0x22A9
      name: "Arctis Nova 7 Diablo IV Edition (Gen 2 firmware)"
      bootloader_pid: 0x223B

  hid:
    usage_page: 0xFFC0
    usage: 0x0001
    command_interface:
      interface: 3
    sync_interface:
      interface: 5

  capabilities:
    - battery
    - bluetooth
    - chatmix
    - custom_eq
    - microphone
