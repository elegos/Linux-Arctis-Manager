transforms:
  connection_status_to_label:
    type: case_int_to_str
    default: UNKNOWN
    values: {0: NOT_PAIRED_NOT_SEARCHING, 1: NOT_PAIRED_SEARCHING, 2: PAIRED_NOT_CONNECTED, 3: PAIRED_CONNECTED}

  charging_status_to_label:
    type: case_int_to_str
    default: UNKNOWN
    values: {0: UNKNOWN_OR_HEADSET_NOT_CONNECTED, 1: PLUGGED_IN_CHARGING, 2: PLUGGED_IN_NOT_CHARGING, 3: DISCHARGING}

  mic_mute_brightness_to_level:
    type: case_int_to_int
    default: 2
    values: {0: 0, 1: 1, 4: 2, 10: 3}

  wireless_mode_to_label:
    type: case_int_to_str
    default: UNKNOWN
    values: {0: RANGE, 1: SPEED}

structs:
  # This family has no report-ID byte on the wire; the firmware always expects
  # 0x00 in that position ("Data size + 1 to account for report ID 0" per the
  # SteelSeries spec). No save_to_flash / sonar / software-chatmix structs
  # exist for this device — it has neither feature.
  mic_volume:
    - {name: report_id,  type: uint8, constant: 0x00}
    - {name: command,    type: uint8, constant: 0x37}
    - {name: mic_volume, type: uint8, range: [0, 15]}

  sidetone:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0x39}
    - {name: sidetone,  type: uint8, range: [0, 10]}

  volume_limiter:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0x27}
    - {name: enabled,   type: uint8, range: [0, 1]}

  power_inactivity_timer:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0xA3}
    - {name: minutes,   type: uint8, range: [0, 255]}

  muted_mic_brightness:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0xAE}
    - {name: level,     type: uint8, range: [0, 3]}

  wireless_mode:
    - {name: report_id, type: uint8, constant: 0x00}
    - {name: command,   type: uint8, constant: 0x35}
    - name: mode
      type: uint8
      range: [0, 1]
      values_mapping: {"0": "range", "1": "speed"}

  wireless_mode_status:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x00}
      - {name: command,   type: uint8, constant: 0x36}
    incoming:
      - {name: report_id, type: uint8, constant: 0x00}
      - {name: command,   type: uint8, constant: 0x36}
      - {name: mode,      type: uint8, range: [0, 1]}

  headset_status:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x00}
      - {name: command,   type: uint8, constant: 0xB0}
    incoming:
      - {name: report_id,          type: uint8, constant: 0x00}
      - {name: command,            type: uint8, constant: 0xB0}
      - {name: connection_status,  type: uint8, range: [0, 3]}
      - {name: unused,             type: uint8}
      - {name: battery_status,     type: uint8, range: [0, 100]}
      - {name: charging_status,    type: uint8, range: [0, 3]}
      - {name: game_chatmix_level, type: uint8, range: [0, 100]}
      - {name: chat_chatmix_level, type: uint8, range: [0, 100]}

  # 10-band PARAMETRIC EQ (frequency + filter type + gain + Q factor per
  # band). Write side: `parametric_eq`/`parametric_eq_bt` below, a 2-message
  # HID_IO write (name/preset announce via 0xA5, band data via 0x33/0x34)
  # using the generic `parametric_eq_name_payload`/`parametric_eq_bands_payload`
  # builtins (registered as `builtin:nova5_eq_name`/`builtin:nova5_eq_bands`
  # in device_session.rs) shared with the Arctis Nova 7 Gen2 family, which
  # uses the same mechanical shape with different constants (a 3rd
  # `update_complete` commit message, a different name command byte, and a
  # signed-tenths-dB gain encoding vs. this device's unsigned half-dB-offset
  # one). Read side: bulk `audio_settings`/`audio_settings_bt` below expose
  # the same 10 bands with the firmware's raw wire encoding (unsigned gain
  # byte, unscaled Q factor) — declared here, structurally correct, but not
  # wired into `sync_read` as a live signal, matching every other shipped EQ
  # device (e.g. Nova Pro Wireless's own `custom_eq_band1..10` read fields):
  # this daemon always resets EQ state on init rather than restoring the
  # hardware's persisted curve, so there is no live-readback convention to
  # follow here.
  parametric_eq:
    - {name: report_id,        type: uint8, constant: 0x00}
    - {name: eq_name_command,  type: uint8, constant: 0xA5}
    - {name: connection_type,  type: uint8, constant: 0x00}
    - {name: preset_type,      type: uint8, range: [0, 1]}
    - {name: eqband_command,   type: uint8, constant: 0x33}
    - {name: band1_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band1_filter_type, type: uint8,   range: [1, 5]}
    - {name: band1_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band1_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band2_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band2_filter_type, type: uint8,   range: [1, 5]}
    - {name: band2_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band2_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band3_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band3_filter_type, type: uint8,   range: [1, 5]}
    - {name: band3_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band3_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band4_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band4_filter_type, type: uint8,   range: [1, 5]}
    - {name: band4_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band4_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band5_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band5_filter_type, type: uint8,   range: [1, 5]}
    - {name: band5_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band5_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band6_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band6_filter_type, type: uint8,   range: [1, 5]}
    - {name: band6_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band6_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band7_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band7_filter_type, type: uint8,   range: [1, 5]}
    - {name: band7_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band7_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band8_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band8_filter_type, type: uint8,   range: [1, 5]}
    - {name: band8_gain,        type: float32, range: [-12.0, 12.0]}
