apis:
  mic_volume:
    write: {transport: HID_IO, chunk_size: 65}

  sidetone:
    write: {transport: HID_IO, chunk_size: 65}

  volume_limiter:
    write: {transport: HID_IO, chunk_size: 65}

  power_inactivity_timer:
    write: {transport: HID_IO, chunk_size: 65}

  muted_mic_brightness:
    write:
      transport: HID_IO
      chunk_size: 65
      payload_transform: "builtin:muted_mic_brightness_write"

  wireless_mode:
    write: {transport: HID_IO, chunk_size: 65}

  wireless_mode_status:
    read: {transport: HID_IO, chunk_size: 65}

  headset_status:
    read: {transport: HID_IO, chunk_size: 65}

  audio_settings:
    read: {transport: HID_IO, chunk_size: 65}

  audio_settings_bt:
    read: {transport: HID_IO, chunk_size: 65}

  ux_settings:
    read: {transport: HID_IO, chunk_size: 65}

  # 600ms gap between the name/preset announce and the band-data message,
  # matching the vendor spec's explicit `time-between-commands` override for
  # this exact write sequence (v2/raw spec calls it out as "might only be
  # applicable to Nova 5"). No commit/update_complete step, unlike the
  # Arctis Nova 7 Gen2 family's 3-message write.
  parametric_eq:
    write:
      steps:
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:nova5_eq_name"}
        - {sleep_ms: 600}
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:nova5_eq_bands"}

  parametric_eq_bt:
    write:
      steps:
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:nova5_eq_name"}
        - {sleep_ms: 600}
        - {transport: HID_IO, chunk_size: 65, payload_transform: "builtin:nova5_eq_bands"}

sync_events:
  0x27:
    emit: volume_limiter_changed
    fields:
      - {name: volume_limiter, byte: 2, display_type: on_off}

  0x37:
    emit: mic_volume_changed
    fields:
      - {name: mic_volume, byte: 2}

  0x39:
    emit: sidetone_changed
    fields:
      - {name: sidetone, byte: 2}

  0x45:
    emit: chatmix_changed
    fields:
      - {name: game_chatmix_level, byte: 2}
      - {name: chat_chatmix_level, byte: 3}

  0xA3:
    emit: power_inactivity_timer_changed
    fields:
      - {name: power_inactivity_timer, byte: 2}

  0xAE:
    emit: muted_mic_brightness_changed
    fields:
      - {name: muted_mic_brightness, byte: 2, transform: mic_mute_brightness_to_level}

  0xB7:
    emit: battery_changed
    fields:
      - {name: battery_status, byte: 2, display_type: percentage}

  0xB9:
    emit: connection_changed
    fields:
      - {name: connection_status, byte: 2, transform: connection_status_to_label}
    side_effects:
      - call: sync_all

  0xBB:
    emit: charging_changed
    fields:
      - {name: charging_status, byte: 2, transform: charging_status_to_label}

sync_read:
  - struct: headset_status
    maps:
      - {emit: connection_changed, field: connection_status, transform: connection_status_to_label}
      - {emit: battery_changed,    field: battery_status,    display_type: percentage}
      - {emit: charging_changed,   field: charging_status,   transform: charging_status_to_label}
      - emit: chatmix_changed
        fields: [game_chatmix_level, chat_chatmix_level]

  - struct: audio_settings
    maps:
      - {emit: mic_volume_changed,     field: mic_volume}
      - {emit: sidetone_changed,       field: sidetone}
      - {emit: volume_limiter_changed, field: volume_limiter, display_type: on_off}
      # EQ band fields are intentionally not mapped here — see the comment
      # above the `parametric_eq`/`audio_settings` structs: this daemon
      # resets EQ state on init rather than restoring the hardware's
      # persisted curve, matching every other shipped EQ device.

  - struct: ux_settings
    maps:
      - {emit: power_inactivity_timer_changed, field: power_inactivity_timer}
      - {emit: muted_mic_brightness_changed,   field: muted_mic_brightness, transform: mic_mute_brightness_to_level}

  - struct: wireless_mode_status
    maps:
      - {emit: wireless_mode_changed, field: mode, transform: wireless_mode_to_label}

lifecycle:
  init:
    # LAM does not provide SteelSeries Sonar, and this device has no
    # set_sonar_present/software_chatmix_status struct at all — nothing to
    # disable. No EQ-flat-reset call either: unlike the Nova Pro family,
    # this device has no `selected_eq_preset`-style preset-select struct for
    # `reset_eq_preset` to target (matches the Arctis Nova 7 Gen2 family,
    # which also ships parametric EQ with no such lifecycle call).
    - call: discord_certified_set_attributes
      args: {echo_cancellation: true, noise_suppression: true}
  # No post_init/shutdown hooks: the engine always runs the full sync_read
  # automatically as part of device_init, and this device has no
  # save_to_flash struct (settings apply immediately, no explicit commit step).
