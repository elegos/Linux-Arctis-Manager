extends: base_arctis_nova_3_wireless

# Both PIDs are protocol-identical per the raw spec — both leaf `.device`
# files `include` the same `base_arctis_nova_3_wireless_tx`, only their own
# PID/bootloader-PID and firmware-target-version constants differ.

device:
  name: "SteelSeries Arctis Nova 3 Wireless"
  vendor_id: 0x1038

  # NOTE ON command_interface/sync_interface: same situation as Nova 5 — the
  # vendor spec only declares a sync (listen) interface (5, usage-page
  # 0xFF00), never a command interface number. Following Nova 5's own
  # precedent (command writes on interface 3, kernel hidraw handles the
  # interrupt-OUT-vs-control-transfer fallback transparently), interface 3
  # is used here too — unconfirmed against real hardware
  # (`lam-cli tools arctis-devices`), same caveat as every other device
  # ported this way.
  variants:
    - product_id: 0x2269
      name: "Arctis Nova 3 Wireless"
      bootloader_pid: 0x226A
    - product_id: 0x226D
      name: "Arctis Nova 3X Wireless"
      bootloader_pid: 0x226E

  hid:
    usage_page: 0xFFC0
    usage: 0x0001
    command_interface:
      interface: 3
    sync_interface:
      interface: 5
      usage_page: 0xFF00
      usage: 0x0001

  capabilities:
    - battery
    - bluetooth
    - chatmix
    - custom_eq
    - microphone
    - wireless
