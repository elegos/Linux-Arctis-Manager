extends: base_arctis_nova_elite

# Both PIDs are protocol-identical (confirmed by diff, no struct/api/sync_event
# differences at all) — standard and the "sng" cosmetic/regional SKU.

device:
  name: "SteelSeries Arctis Nova Elite"
  vendor_id: 0x1038

  # Raw spec and v2 fully agree here (interface 3 for both command and sync)
  # — no discrepancy to flag, unlike Nova 5/Arctis 7+.
  variants:
    - product_id: 0x2244
      name: "Arctis Nova Elite"
      bootloader_pid: 0x2245
    - product_id: 0x2270
      name: "Arctis Nova Elite SNG"
      bootloader_pid: 0x2271

  hid:
    usage_page: 0xFFC0
    usage: 0x0001
    command_interface:
      interface: 3
    sync_interface:
      interface: 3
      usage_page: 0xFF00
      usage: 0x0001

  capabilities:
    - battery
    - bluetooth
    - chatmix
    - microphone
    - noise_cancelling
