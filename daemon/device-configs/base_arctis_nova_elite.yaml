# The richest family so far: real ANC (off/transparent/on + level), two
# independent sidetone paths (boom mic vs on-ear mic), Bluetooth, and a
# station display with home-screen/screensaver settings. Report id 0x01
# (not 0x06 like the Nova Pro family), chunk_size 64.
#
# EQ (wireless/Bluetooth/microphone) has no simple "select preset by id"
# write command, unlike every other family so far: presets are named slots,
# written as a whole curve + alias/name strings in one HID_FEATURE message
# (`parametric_eq`/`ten_band_eq_mic`/`ten_band_eq_bt`, 0x1B/0x1D/0x1F). v2's
# `equalizer_wireless`/`equalizer_bluetooth`/`equalizer_mic` settings
# (`update_sequence: [0x01, 0x2d/0x2e/0x2f, 'value']`) don't correspond to
# anything in this spec — no 0x2D/0x2E/0x2F command exists anywhere in it.
# The named-slot *write* is modelled below (see structs.parametric_eq and
# friends); reading a slot back is deferred, same convention as every other
# shipped EQ device — see the v3 backlog ([E7-S10]) for the exact rationale.
#
# `audio_settings` (mic volume/sidetone/line-out/stream-mix/chatmix startup
# snapshot) shares the EQ structs' 1036-byte HID_FEATURE read. That size isn't
# actually enforced anywhere in this codebase — hid-transport's
# REPORT_SIZE_HID_FEATURE_MAX (1024) is documentation only, chunk_size flows
# straight into the buffer allocation with no clamp — so it's modelled below
# as chunk_size: 1036 like the spec says. The EQ-band portions of the struct
# (10 custom bands + 10 measured bands + 10 BT gains + 10 mic gains, 140 bytes
# total) are reserved as opaque placeholders to keep the fields after them
# correctly aligned, same trick as Nova 5's `eq_data_raw`. Unconfirmed on real
# hardware: the 1036 figure comes from the vendor's Windows-side spec, and
# while nothing in the kernel's own HIDIOCGFEATURE path is known to cap
# below that, the device's actual USB HID report descriptor is the only true
# authority on this and hasn't been checked directly.

transforms:
  connection_status_to_label:
    type: case_int_to_str
    default: UNKNOWN
    values: {1: NOT_PAIRED_NOT_SEARCHING, 2: NOT_PAIRED_SEARCHING, 4: PAIRED_NOT_CONNECTED, 8: PAIRED_CONNECTED}

  charging_status_to_label:
    type: case_int_to_str
    default: UNKNOWN
    values: {1: UNKNOWN_OR_HEADSET_NOT_CONNECTED, 2: PLUGGED_IN_CHARGING, 4: PLUGGED_IN_NOT_CHARGING, 8: DISCHARGING}

  timer_enum_to_minutes:
    type: case_int_to_int
    default: 30
    values: {0: 0, 1: 1, 2: 5, 3: 10, 4: 15, 5: 30, 6: 60}

structs:
  # Found missing from this device's original conversion pass while auditing
  # save_to_flash: the raw spec's shutdown lifecycle calls disable-sonar and
  # (via the settings write path) toggles software chatmix, but neither
  # `set_sonar_present` nor `software_chatmix_status` was ever modelled here
  # — the `disable_chatmix`/`disable_sonar` lifecycle calls below would have
  # failed at runtime with an unknown-API error. Same command bytes/shapes as
  # Nova Pro Wireless's own (0x8D/0x49), just this device's own report_id.
  set_sonar_present:
    - {name: report_id,  type: uint8, constant: 0x01}
    - {name: command,    type: uint8, constant: 0x8D}
    - {name: is_present, type: uint8, range: [0, 1]}

  software_chatmix_status:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0x49}
    - {name: status,    type: uint8, range: [0, 1]}

  # Also found missing in the same audit: no save_to_flash at all, so no
  # setting written during a session ever survived a power cycle. The spec
  # requires a 500ms delay BEFORE the write (comment: "FW needs time to
  # process the previous setting command") — the opposite order from Nova 7
  # Gen2's save_to_flash, which sleeps AFTER. Expressed below as a two-step
  # write sequence (sleep, then write).
  save_to_flash:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0x09}

  volume_limiter:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0x27}
    - {name: enabled,   type: uint8, range: [0, 1]}

  mic_volume:
    - {name: report_id,  type: uint8, constant: 0x01}
    - {name: command,    type: uint8, constant: 0x37}
    - {name: mic_volume, type: uint8, range: [1, 10]}

  # Two independent sidetone paths — a detachable boom mic and the headset's
  # own on-ear mic. Each has its own enable state plus level.
  boom_mic_sidetone:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0x38}
    - {name: state,     type: uint8, range: [0, 1]}
    - {name: level,     type: uint8, range: [1, 10]}

  # NOT here: `on_ear_sidetone` (0x39). Only Nova Elite proper has a second,
  # detachable on-ear mic; Nova Pro Omni's raw spec has no 0x39 handling and
  # no on-ear fields in its own `audio_settings` redefinition at all — this
  # struct lives in nova_elite.yaml instead so Omni (which also extends this
  # base) doesn't inherit a write command its hardware doesn't have. Structs/
  # apis merge by key with no delete, so anything genuinely Elite-only must
  # not live here.

  muted_mic_brightness:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0xBF}
    - {name: level,     type: uint8, range: [0, 10]}

  # [0] All off, [1] transparent-level mode, [2] ANC mode. The active level
  # within whichever mode is active is set separately via `transparent`
  # (0-10%) or `active_noise_cancellation` (low/medium/high).
  transparent_anc_mode:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0xBD}
    - name: mode
      type: uint8
      range: [0, 2]
      values_mapping: {"0": "off", "1": "transparent", "2": "anc"}

  active_noise_cancellation:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0xB8}
    - name: level
      type: uint8
      range: [1, 3]
      values_mapping: {"1": "low", "2": "medium", "3": "high"}

  transparent:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0xB9}
    - {name: level,     type: uint8, range: [1, 10]}

  inactivity_timer:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0xC1}
    - {name: minutes,   type: uint8, values: [0, 1, 5, 10, 15, 30, 60]}

  # NOTE: v2 labelled these values "Speaker"/"Stream", same guess it made for
  # Nova Pro Wired's line_out_mode (corrected there against an explicit
  # vendor comment). This struct has no such comment in the spec, so unlike
  # the wired Nova Pro, there's nothing here to confirm or correct v2's
  # labels against — kept as-is, flagged as unconfirmed.
  line_out_mode:
    - {name: report_id,     type: uint8, constant: 0x01}
    - {name: command,       type: uint8, constant: 0x43}
    - {name: line_out_mode, type: uint8, range: [1, 2], values_mapping: {"1": "speaker", "2": "stream"}}

  # Spec bug carried over faithfully in intent, not literally: the vendor
  # struct declares `main` twice back-to-back instead of `main`+`unused`
  # (copy-paste error). Modelled with the correct 4-byte layout (matches
  # every other stream_mix in this codebase) since that's what the firmware
  # actually expects on the wire.
  stream_mix:
    - {name: report_id,   type: uint8, constant: 0x01}
    - {name: command,     type: uint8, constant: 0x47}
    - {name: stream_main, type: uint8, range: [0, 100]}
    - {name: unused,      type: uint8, constant: 0x00}
    - {name: stream_aux,  type: uint8, range: [0, 100]}
    - {name: stream_mic,  type: uint8, range: [0, 100]}

  oled_screen_brightness:
    - {name: report_id,       type: uint8, constant: 0x01}
    - {name: command,         type: uint8, constant: 0x85}
    - {name: oled_brightness, type: uint8, range: [1, 10]}

  oled_screen_saver_timer:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0x83}
    - {name: minutes,   type: uint8, values: [0, 1, 5, 10, 15, 30, 60]}

  oled_screen_saver_mode:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0x88}
    - {name: mode,      type: uint8, range: [0, 1], values_mapping: {"0": "off", "1": "dim"}}

  home_screen_view:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0x89}
    - {name: mode,      type: uint8, range: [0, 1], values_mapping: {"0": "detailed", "1": "simple"}}

  home_screen_option:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0x8A}
    - name: mode
      type: uint8
      range: [0, 2]
      values_mapping: {"0": "stereo", "1": "preset", "2": "meters"}

  bt_power_default:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0xB2}
    - {name: enabled,   type: uint8, range: [0, 1]}

  bt_call_default:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0xB3}
    - name: mode
      type: uint8
      range: [0, 2]
      values_mapping: {"0": "off", "1": "attenuate", "2": "mute"}

  # No write command exists for wireless_mode (v2 assumed one at 0xC3; no
  # such command appears anywhere in this spec) — read-only via
  # wireless_settings below, not exposed as a setting.
  wireless_settings:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x01}
      - {name: command,   type: uint8, constant: 0xB0}
    incoming:
      - {name: report_id,              type: uint8, constant: 0x01}
      - {name: command,                type: uint8, constant: 0xB0}
      - {name: bt_power_default,       type: uint8, range: [0, 1]}
      - {name: bt_call_default,        type: uint8, range: [0, 2]}
      - {name: bt_connection_mode,     type: uint8, range: [1, 4]}
      - {name: bt_connection_status,   type: uint8, range: [0, 8]}
      - {name: headset_batt_level,     type: uint8, range: [0, 100]}
      - {name: charger_batt_level,     type: uint8, range: [0, 100]}
      - {name: transparent_level,      type: uint8, range: [1, 10]}
      - {name: mic_muted,              type: uint8, range: [0, 1]}
      - {name: transparent_anc_mode,   type: uint8, range: [0, 2]}
      - {name: muted_mic_brightness,   type: uint8, range: [1, 10]}
      - {name: inactivity_timer,       type: uint8, range: [0, 6]}
      - {name: wireless_mode,          type: uint8, range: [0, 1]}
      - {name: radio_connection_status, type: uint8, values: [1, 2, 4, 8]}
      - {name: charging_status,        type: uint8, values: [1, 2, 4, 8]}
      - {name: active_noise_cancellation, type: uint8, range: [1, 3]}

  ux_settings:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x01}
      - {name: command,   type: uint8, constant: 0x80}
    incoming:
      - {name: report_id,             type: uint8, constant: 0x01}
      - {name: command,               type: uint8, constant: 0x80}
      - {name: oled_screen_saver_timer, type: uint8, range: [0, 6]}
      - {name: oled_brightness,       type: uint8, range: [1, 10]}
      - {name: unused,                type: uint8}
      - {name: home_screen_view,      type: uint8, range: [0, 1]}
      - {name: unused2,               type: bytearray, size: 4}
      - {name: oled_screen_saver_mode, type: uint8, range: [0, 1]}
      - {name: home_screen_option,    type: uint8, range: [0, 2]}

  # Startup snapshot for everything write-only above that has no dedicated
  # read command of its own (mic volume, both sidetone paths, line-out mode,
  # stream mix, volume limiter, chatmix). EQ preset ids and the mic-noise-
  # reduction fields are declared (real names, real positions) but not
  # sync_read-mapped — those features aren't implemented yet (see the header
  # comment), no point wiring events nothing will use.
  audio_settings:
    outgoing:
      - {name: report_id, type: uint8, constant: 0x01}
      - {name: command,   type: uint8, constant: 0x20}
    incoming:
      - {name: report_id,             type: uint8, constant: 0x01}
      - {name: command,               type: uint8, constant: 0x20}
      - {name: custom_eq_bands_raw,   type: bytearray, size: 60}
      - {name: measured_eq_bands_raw, type: bytearray, size: 60}
      - {name: bt_gains_raw,          type: bytearray, size: 10}
      - {name: mic_gains_raw,         type: bytearray, size: 10}
      - {name: audio_input,           type: uint8, range: [0, 3]}
      - {name: station_volume,        type: uint8, range: [0, 38]}
      - {name: volume_limiter,        type: uint8, range: [0, 1]}
      - {name: surround_mode,         type: uint8, range: [0, 1]}
      - {name: mic_volume,            type: uint8, range: [1, 10]}
      - {name: boom_sidetone_level,   type: uint8, range: [1, 10]}
      - {name: line_out_mode,         type: uint8, range: [1, 2]}
      - {name: radio_selected_eq_preset,       type: uint8, range: [0, 5]}
      - {name: microphone_selected_eq_preset,  type: uint8, range: [0, 8]}
      - {name: bluetooth_selected_eq_preset,   type: uint8, range: [0, 4]}
      - {name: chatmix_game,          type: uint8, range: [0, 100]}
      - {name: chatmix_chat,          type: uint8, range: [0, 100]}
      - {name: unused1,               type: bytearray, size: 2}
      - {name: stream_main,           type: uint8, range: [0, 100]}
      - {name: unused2,               type: uint8}
      - {name: stream_aux,            type: uint8, range: [0, 100]}
      - {name: stream_mic,            type: uint8, range: [0, 100]}
      - {name: unused3,               type: bytearray, size: 5}
      - {name: mic_noise_reduction_setting,   type: uint8, values: [0, 1, 16, 17]}
      - {name: mic_boom_reduction_level,      type: uint8, range: [0, 3]}
      - {name: on_ear_mic_reduction_level,    type: uint8, range: [0, 3]}
      - {name: unused4,               type: bytearray, size: 2}
      - {name: boom_sidetone_state,   type: uint8, range: [0, 1]}
      - {name: on_ear_sidetone_level, type: uint8, range: [1, 10]}
      - {name: on_ear_sidetone_state, type: uint8, range: [0, 1]}

  # One-shot factory-reset trigger — an action, not a persisted setting.
  # Exposed via the `TriggerAction` D-Bus method ([E7-S9]), e.g.
  # `TriggerAction("restore_factory_default", "")`.
  restore_factory_default:
    - {name: report_id, type: uint8, constant: 0x01}
    - {name: command,   type: uint8, constant: 0xFD}

  # [E7-S10] Named-slot EQ presets. Unlike every other shipped EQ device,
  # there's no "select preset N" write — the entire curve, plus a short
  # `alias_name` (6 chars, shown on the OLED) and a longer free-text `name`
  # (61 chars), is written into one onboard slot in a single HID_FEATURE
  # message. `preset_type` (0=factory preset, 1=custom) doesn't appear
  # below: on the real wire, GG's own app resolves preset_type + a name
  # string match against the factory preset names ("Flat", "Bass Boost", …)
  # into a raw onboard slot index before writing — this DSL has no string-
  # matching primitive, so `onboard_preset_index` is exposed directly
  # instead (0-3/0-7 = the device's own named factory slots, the last index
  # = "Custom"). Reading a slot back is not modelled — same convention as
  # every other shipped EQ device (never wired into `sync_read`), and this
  # device has no simple index-addressed curve read either (named slots are
  # read by 0x18-style per-domain commands this pass doesn't cover).
  #
  # `alias_name`/`name` are `varstring` with a `size:` cap even though they
  # aren't the last field in the struct — `codec::encode_field` zero-pads a
  # sized varstring to exactly `size` bytes on write (needed here so band/
  # gain data lands at the fixed offset the firmware expects; a no-op for
  # every other device, where a sized varstring already is the last field
  # and gets zero-padded by the transport's own chunk_size padding anyway).
  #
  # Wireless domain only, genuinely parametric (frequency/filter-type/gain/
  # Q-factor per band) — same wire shape as Nova 7 Gen2/Nova 5's own
  # parametric EQ (11 bytes in, 6 bytes out per band), just packed into one
  # message instead of a multi-step write.
  parametric_eq:
    - {name: report_id,           type: uint8, constant: 0x01}
    - {name: command,             type: uint8, constant: 0x1B}
    - {name: onboard_preset_index, type: uint8, range: [0, 4]}
    - {name: alias_name,          type: varstring, size: 6}
    - {name: name,                type: varstring, size: 61}
    - {name: band1_frequency,   type: uint16,  range: [20, 20001]}
    # Raw spec declares (range 1 6) though its own comment only documents 5
    # filter types (Peak/Low Pass/High Pass/Low Shelving/High Shelving) —
    # kept literal, unconfirmed against real hardware.
    - {name: band1_filter_type, type: uint8,   range: [1, 6]}
    - {name: band1_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band1_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band2_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band2_filter_type, type: uint8,   range: [1, 6]}
    - {name: band2_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band2_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band3_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band3_filter_type, type: uint8,   range: [1, 6]}
    - {name: band3_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band3_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band4_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band4_filter_type, type: uint8,   range: [1, 6]}
    - {name: band4_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band4_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band5_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band5_filter_type, type: uint8,   range: [1, 6]}
    - {name: band5_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band5_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band6_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band6_filter_type, type: uint8,   range: [1, 6]}
    - {name: band6_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band6_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band7_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band7_filter_type, type: uint8,   range: [1, 6]}
    - {name: band7_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band7_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band8_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band8_filter_type, type: uint8,   range: [1, 6]}
    - {name: band8_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band8_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band9_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band9_filter_type, type: uint8,   range: [1, 6]}
    - {name: band9_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band9_q_factor,    type: float32, range: [0.2, 10.0]}
    - {name: band10_frequency,   type: uint16,  range: [20, 20001]}
    - {name: band10_filter_type, type: uint8,   range: [1, 6]}
    - {name: band10_gain,        type: float32, range: [-12.0, 12.0]}
    - {name: band10_q_factor,    type: float32, range: [0.2, 10.0]}

  # Microphone/Bluetooth domains: gain-only ("ten band graphic") EQ, not
  # parametric — no frequency/filter-type/Q-factor, just 10 fixed-frequency
  # gains. The raw spec's own `transform_gain_fw_to_ui` comment (`0x88 =
  # -12dB … 0x00 = 0.0dB … 0x78 = 12dB`) confirms the gain byte is the same
  # signed-tenths-dB encoding as `parametric_eq` above, not the unsigned
  # half-dB-offset formula the Nova Pro/Arctis 7+ families' own graphic EQ
  # uses — see `builtin:nova_elite_ten_band_eq`.
  ten_band_eq_mic:
    - {name: report_id,           type: uint8, constant: 0x01}
    - {name: command,             type: uint8, constant: 0x1D}
    - {name: onboard_preset_index, type: uint8, range: [0, 8]}
    - {name: alias_name,          type: varstring, size: 6}
    - {name: name,                type: varstring, size: 61}
    - {name: band1_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band2_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band3_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band4_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band5_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band6_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band7_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band8_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band9_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band10_gain, type: float32, range: [-12.0, 12.0]}

  ten_band_eq_bt:
    - {name: report_id,           type: uint8, constant: 0x01}
    - {name: command,             type: uint8, constant: 0x1F}
    - {name: onboard_preset_index, type: uint8, range: [0, 4]}
    - {name: alias_name,          type: varstring, size: 6}
    - {name: name,                type: varstring, size: 61}
    - {name: band1_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band2_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band3_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band4_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band5_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band6_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band7_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band8_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band9_gain,  type: float32, range: [-12.0, 12.0]}
    - {name: band10_gain, type: float32, range: [-12.0, 12.0]}

apis:
  set_sonar_present:
    write: {transport: HID_IO, chunk_size: 64}
  software_chatmix_status:
    write: {transport: HID_IO, chunk_size: 64}
  save_to_flash:
    write:
      steps:
        - {sleep_ms: 500}
        - {transport: HID_IO, chunk_size: 64}
  volume_limiter:
    write: {transport: HID_IO, chunk_size: 64}
  mic_volume:
    write: {transport: HID_IO, chunk_size: 64}
  boom_mic_sidetone:
    write: {transport: HID_IO, chunk_size: 64}
  muted_mic_brightness:
    write: {transport: HID_IO, chunk_size: 64}
  transparent_anc_mode:
    write: {transport: HID_IO, chunk_size: 64}
  active_noise_cancellation:
    write: {transport: HID_IO, chunk_size: 64}
  transparent:
    write: {transport: HID_IO, chunk_size: 64}
  inactivity_timer:
    write:
      transport: HID_IO
      chunk_size: 64
      payload_transform: "builtin:power_timer_write"
  line_out_mode:
    write: {transport: HID_IO, chunk_size: 64}
  stream_mix:
    write: {transport: HID_IO, chunk_size: 64}
  oled_screen_brightness:
    write: {transport: HID_IO, chunk_size: 64}
  oled_screen_saver_timer:
    write:
      transport: HID_IO
      chunk_size: 64
      payload_transform: "builtin:power_timer_write"
  oled_screen_saver_mode:
    write: {transport: HID_IO, chunk_size: 64}
  home_screen_view:
    write: {transport: HID_IO, chunk_size: 64}
  home_screen_option:
    write: {transport: HID_IO, chunk_size: 64}
  bt_power_default:
    write: {transport: HID_IO, chunk_size: 64}
  bt_call_default:
    write: {transport: HID_IO, chunk_size: 64}
  wireless_settings:
    read: {transport: HID_IO, chunk_size: 64}
  ux_settings:
    read: {transport: HID_IO, chunk_size: 64}
  audio_settings:
    read: {transport: HID_FEATURE, chunk_size: 1036}
  restore_factory_default:
    action: true
    write: {transport: HID_IO, chunk_size: 64}
  parametric_eq:
    write:
      transport: HID_FEATURE
      chunk_size: 1036
      payload_transform: "builtin:parametric_eq_named_slot"
      payload_transform_args: {header_len: 70, band_count: 10, gain_flavour: signed_tenths_db}
  ten_band_eq_mic:
    write:
      transport: HID_FEATURE
      chunk_size: 1036
      payload_transform: "builtin:named_slot_signed_gains"
      payload_transform_args: {header_len: 70}
  ten_band_eq_bt:
    write:
      transport: HID_FEATURE
      chunk_size: 1036
      payload_transform: "builtin:named_slot_signed_gains"
      payload_transform_args: {header_len: 70}

# Field `name:` values are deliberately chosen to match the corresponding
# `sync_read:` struct field name below for the same `emit:`, so a live event
# and the startup snapshot for the same setting always carry the same JSON
# key — not just the same value shape.
sync_events:
  0x27:
    emit: volume_limiter_changed
    fields:
      - {name: volume_limiter, byte: 2, display_type: on_off}

  0x37:
    emit: mic_volume_changed
    fields:
      - {name: mic_volume, byte: 2}

  0x38:
    emit: boom_mic_sidetone_changed
    fields:
      - {name: boom_sidetone_state, byte: 2}
      - {name: boom_sidetone_level, byte: 3}

  0x43:
    emit: line_out_mode_changed
    fields:
      - {name: line_out_mode, byte: 2}

  0x45:
    emit: chatmix_changed
    fields:
      - {name: chatmix_game, byte: 2}
      - {name: chatmix_chat, byte: 3}

  0x47:
    emit: stream_mix_changed
    fields:
      - {name: stream_main, byte: 2}
      - {name: stream_aux,  byte: 4}
      - {name: stream_mic,  byte: 5}

  0x83:
    emit: oled_screen_saver_timer_changed
    fields:
      - {name: oled_screen_saver_timer, byte: 2, transform: timer_enum_to_minutes}

  0x85:
    emit: oled_brightness_changed
    fields:
      - {name: oled_brightness, byte: 2, display_type: percentage}

  0x88:
    emit: oled_screen_saver_mode_changed
    fields:
      - {name: oled_screen_saver_mode, byte: 2}

  0x89:
    emit: home_screen_view_changed
    fields:
      - {name: home_screen_view, byte: 2}

  0x8A:
    emit: home_screen_option_changed
    fields:
      - {name: home_screen_option, byte: 2}

  0xB2:
    emit: bt_power_default_changed
    fields:
      - {name: bt_power_default, byte: 2, display_type: on_off}

  0xB3:
    emit: bt_call_default_changed
    fields:
      - {name: bt_call_default, byte: 2}

  0xB5:
    emit: connection_changed
    fields:
      - {name: radio_connection_status, byte: 4, transform: connection_status_to_label}
    side_effects:
      - call: sync_all

  0xB7:
    emit: battery_changed
    fields:
      - {name: headset_batt_level, byte: 2, display_type: percentage}
      - {name: charger_batt_level, byte: 3, display_type: percentage}
      - {name: charging_status,    byte: 4, transform: charging_status_to_label}

  0xB8:
    emit: active_noise_cancellation_changed
    fields:
      - {name: active_noise_cancellation, byte: 2}

  0xB9:
    emit: transparent_changed
    fields:
      - {name: transparent_level, byte: 2, display_type: percentage}

  0xBB:
    emit: mic_muted_changed
    fields:
      - {name: mic_muted, byte: 2, display_type: on_off}

  0xBD:
    emit: transparent_anc_mode_changed
    fields:
      - {name: transparent_anc_mode, byte: 2}

  0xBF:
    emit: muted_mic_brightness_changed
    fields:
      - {name: muted_mic_brightness, byte: 2}

  0xC1:
    emit: inactivity_timer_changed
    fields:
      - {name: inactivity_timer, byte: 2, transform: timer_enum_to_minutes}

sync_read:
  - struct: wireless_settings
    maps:
      - {emit: bt_power_default_changed,          field: bt_power_default,       display_type: on_off}
      - {emit: bt_call_default_changed,            field: bt_call_default}
      - {emit: transparent_changed,                field: transparent_level,      display_type: percentage}
      - {emit: mic_muted_changed,                  field: mic_muted,              display_type: on_off}
      - {emit: transparent_anc_mode_changed,       field: transparent_anc_mode}
      - {emit: muted_mic_brightness_changed,       field: muted_mic_brightness}
      - {emit: inactivity_timer_changed,           field: inactivity_timer,       transform: timer_enum_to_minutes}
      - {emit: connection_changed,                 field: radio_connection_status, transform: connection_status_to_label}
      - {emit: battery_changed,                    field: headset_batt_level,     display_type: percentage}
      - {emit: active_noise_cancellation_changed,  field: active_noise_cancellation}

  - struct: ux_settings
    maps:
      - {emit: oled_screen_saver_timer_changed, field: oled_screen_saver_timer, transform: timer_enum_to_minutes}
      - {emit: oled_brightness_changed,         field: oled_brightness,         display_type: percentage}
      - {emit: home_screen_view_changed,        field: home_screen_view}
      - {emit: oled_screen_saver_mode_changed,  field: oled_screen_saver_mode}
      - {emit: home_screen_option_changed,      field: home_screen_option}

  - struct: audio_settings
    maps:
      - {emit: mic_volume_changed,       field: mic_volume}
      - {emit: volume_limiter_changed,   field: volume_limiter, display_type: on_off}
      - {emit: line_out_mode_changed,    field: line_out_mode}
      - {emit: station_volume_changed,   field: station_volume, display_type: percentage}
      - {emit: surround_changed,         field: surround_mode,  display_type: on_off}
      - emit: boom_mic_sidetone_changed
        fields: [boom_sidetone_state, boom_sidetone_level]
      - emit: on_ear_sidetone_changed
        fields: [on_ear_sidetone_state, on_ear_sidetone_level]
      - emit: stream_mix_changed
        fields: [stream_main, stream_aux, stream_mic]
      - emit: chatmix_changed
        fields: [chatmix_game, chatmix_chat]

lifecycle:
  init:
    # LAM does not provide SteelSeries Sonar.
    - call: discord_certified_set_attributes
      args: {echo_cancellation: true, noise_suppression: true}
  shutdown:
    - call: disable_chatmix
    - call: disable_sonar
    - call: save_to_flash
