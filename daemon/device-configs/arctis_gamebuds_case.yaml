extends: base_arctis_gamebuds_case

device:
  name: "SteelSeries Arctis GameBuds Case"
  vendor_id: 0x1038

  # The case only accompanies the dongle: the engine routes status, settings
  # and EQ to the dongle first when both are connected, and lam-hidraw-helper
  # accepts the PIDs below despite the case having no USB audio interface.
  companion: true

  # sync_interface is taken as declared by the raw spec
  # (`(sync-interface 0xffc1 0x0001 2)`, confirmed identical for both PID
  # pairs below). command_interface is 0: on real
  # GameBuds X Case hardware (0x231A) the case exposes only HID interfaces
  # 0-2, and interface 0 is the 0xFFC0/0x0001 vendor collection declared
  # under `hid` below. The 0x230C case is assumed to match; unverified.
  variants:
    - product_id: 0x230C
      name: "Arctis GameBuds Case"
      bootloader_pid: 0x230D
    - product_id: 0x231A
      name: "Arctis GameBuds X Case"
      bootloader_pid: 0x231B

  hid:
    usage_page: 0xFFC0
    usage: 0x0001
    command_interface:
      interface: 0
    sync_interface:
      interface: 2
      usage_page: 0xFFC1
      usage: 0x0001
    # Confirmed on GameBuds X hardware: replies arrive without a report-ID
    # byte (e.g. `b7 00 00 64 ...`), on both the command and sync pipes.
    unnumbered_reports: true

  capabilities:
    - battery
