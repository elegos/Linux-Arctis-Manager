[workspace]
resolver = "2"
members = [
    "engine",
    "hidraw-helper",
    "device-config",
    "hid-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Giacomo 'Mr. Wolf' Furlan <g.furlan@accenture.com>"]

# Declare all expected workspace dependencies here so member crates can
# reference them with `{ workspace = true }` without updating this file.
[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# D-Bus
zbus = { version = "5", default-features = false, features = ["tokio"] }
# structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# udev hot-plug (requires libudev at link time — added in E1-S3)
tokio-udev = "0.10"
# HID (requires hidapi / libudev at link time — added in E1-S2)
hidapi = { version = "2", default-features = false, features = ["linux-native"] }
# Unix system calls (getuid, sendmsg/SCM_RIGHTS for E2)
nix = { version = "0.30", features = ["user", "socket", "uio", "ioctl", "fs"] }
# serialisation
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# HTTP client (HuggingFace Hub API, base RVC model downloads — added in E10-S3).
# native-tls (system OpenSSL via FFI), not rustls: both of rustls' crypto
# providers (ring, then aws-lc-rs after a first attempt to switch) fail to
# link on Arch's current toolchain with dozens of undefined-symbol errors
# from ld.lld — the same failure class either way, since both compile
# vendored C/ASM from source into a static archive. OpenSSL is dynamically
# linked, sidestepping that whole class of problem. Needs libssl-dev /
# openssl-devel / openssl (+ pkg-config) at build time — see packaging.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# checksums (base RVC model download verification — added in E10-S3)
sha2 = "0.10"
# zip archive extraction (RVC WebUI .pth+.index bundles — added in E10-S3);
# deflate via flate2's pure-Rust backend, no system zlib required
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# real FFT, for the VTLN formant warp (frequency-domain resample) — added in E10-S6a
realfft = "3"
# ONNX Runtime bindings for the RVC inference engine — added in E10-S6a.
# `load-dynamic` defers loading libonnxruntime.so to runtime (ort::init_from),
# so the build has no dependency on any vendor SDK (CUDA/ROCm/OpenVINO) being
# installed on the build machine — confirmed by a clean build here with none
# of them present. cuda/rocm/openvino only add the Rust-side EP option types;
# whether each is actually usable is decided at runtime by is_available()/
# register(), with automatic fallback to the CPU provider.
# Resampling model_sr -> the fixed 48kHz output rate — added in E10-S6a.
# Replaces torchaudio.functional.resample; not a bit-exact port (a
# windowed-sinc kernel resampler's exact quality isn't behavior this
# application's tuned constants depend on, unlike the DSP in vc_dsp.rs).
rubato = "5"
audioadapter-buffers = "5"
# RNG for the synthesizer's externalised VITS/NSF noise inputs — added in E10-S6a.
# Pinned to match rand_distr 0.6's own rand_core 0.10 requirement — rand 0.9
# resolves to an incompatible rand_core 0.9, so its Distribution trait
# doesn't line up with rand_distr's despite both nominally being "rand ecosystem".
rand = "0.10"
rand_distr = "0.6"
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "cuda",
    "rocm",
    "openvino",
    "tracing",
    "api-27",
] }
# Already pulled in transitively by ort's own load-dynamic feature; declared
# directly too so the RVC engine can preload a pip-installed cuDNN itself
# (see vc/inference/engine.rs::preload_cudnn) — added in E10-S6a.
libloading = "0.9"
# internal crates
device-config = { path = "device-config" }
hid-transport = { path = "hid-transport" }
lam-hidraw-helper = { path = "hidraw-helper" }
