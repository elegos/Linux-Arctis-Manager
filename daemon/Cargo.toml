[workspace]
resolver = "2"
members = [
    "engine",
    "hidraw-helper",
    "device-config",
    "hid-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Giacomo 'Mr. Wolf' Furlan <g.furlan@accenture.com>"]

# Declare all expected workspace dependencies here so member crates can
# reference them with `{ workspace = true }` without updating this file.
[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
# D-Bus
zbus = { version = "5", default-features = false, features = ["tokio"] }
# structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# udev hot-plug (requires libudev at link time — added in E1-S3)
tokio-udev = "0.10"
# HID (requires hidapi / libudev at link time — added in E1-S2)
hidapi = { version = "2", features = ["linux-native"] }
# serialisation
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# internal crates
device-config = { path = "device-config" }
hid-transport = { path = "hid-transport" }
