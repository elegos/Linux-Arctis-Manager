# Registers the optional physical-sink-hiding policy script (GH #67) as an
# always-loaded WirePlumber component. See sink-visibility.lua for why this
# must be an always-loaded script rather than something toggled at runtime,
# and daemon/engine/src/sink_visibility.rs for the daemon side of the
# lease-file handshake that turns its behavior on and off.
#
# `name` here is resolved the same way as WirePlumber's own built-in
# components (e.g. `client/access-default.lua`) -- relative to the script
# search path, which is why the script itself installs under
# .../wireplumber/scripts/lam/ rather than being referenced by absolute path.
wireplumber.components = [
  {
    name = lam/sink-visibility.lua, type = script/lua
  }
]
