[project]
name = "linux-arctis-manager"
version = "3.0.0-alpha2"
description = "A replacement for SteelSeries GG software, to manage your Arctis device on Linux!"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbus-next>=0.2.3",
    "huggingface_hub>=0.23.0",
    "pulsectl>=24.12.0",
    "pyside6>=6.10.1",
    "pyudev>=0.24.4",
    "pyusb>=1.3.1",
    "requests>=2.32.0",
    "ruamel-yaml>=0.19.1",
    "vdf>=3.4",
]

[project.scripts]
lam-cli = "linux_arctis_manager.scripts.cli:main"
lam-gui = "linux_arctis_manager.scripts.gui:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
]

[tool.coverage.run]
omit = [
    "src/linux_arctis_manager/gui/*",
    # Needs torch/numpy/onnxruntime, provisioned in a separate AI env this
    # project's dev venv doesn't carry (see packaging/onnxruntime-install/).
    "src/linux_arctis_manager/voice_changer/rvc/synth.py",
    "src/linux_arctis_manager/voice_changer/rvc/synth_modules.py",
    "src/linux_arctis_manager/voice_changer/rvc/export_onnx.py",
]

[tool.coverage.report]
# Floor set a few points below the measured baseline (91%) as a
# regression guard, not a target — raise it as real coverage grows.
fail_under = 88

[tool.pyright]
typeCheckingMode = "standard"
reportUnknownMemberType = "none"
reportMissingTypeStubs = "none"
reportExplicitAny = "none"
reportAny = "none"
reportUnknownVariableType = "none"
reportImplicitOverride = "none"
extraPaths = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle (default subset: no line-length/whitespace nagging)
    "F",               # pyflakes
    "I",               # isort (replaces the isort dev dependency)
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "PERF",            # perflint
    "PL",              # pylint
    "RUF",             # ruff-specific
]
ignore = [
    "PLR2004",  # magic-value-comparison: too noisy for HID protocol/UI code full of literal constants
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # complexity metrics: design opinion, not a bug signal
    "PLC0415",  # import-outside-top-level: deliberate lazy-import pattern in this codebase (heavy/optional deps)
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode-character: false positives on legitimate UI/i18n text
]
